# A road bike whose owner has a work stand. Much is known about the bike.

profile:
  id: road-bike-stand
  name: "Road bike with a work stand"
  description: "Road bike, 11-speed mechanical rear derailleur. The owner has a work stand."
  bike_name: "Corvana Strada SL 3"
  facts:
    bike.brand: "Corvana"
    bike.line: "Strada"
    bike.model: "SL 3"
    bike.year: 2020
    bike.handlebar: drop
    bike.colour: "#1f4e79"
    geometry.stack_mm: 560
    geometry.reach_mm: 385
    geometry.head_tube_mm: 150
    geometry.seat_tube_mm: 520
    geometry.top_tube_mm: 550
    geometry.chainstay_mm: 410
    geometry.wheelbase_mm: 990
    geometry.bb_drop_mm: 72
    geometry.head_angle_deg: 73
    geometry.seat_angle_deg: 73.5
    geometry.wheel_bsd_mm: 622
    bike.category: road_gravel
    bike.ebike: false
    drive.gear_type: derailleur
    drive.shifting: mechanical
    drive.rear_speeds: 11
    drive.rear_derailleur_model: "Shimano 105 RD-R7000"
  answers: {}
  tools: [bike-stand]
  journeys:
    - id: chain-touches-spokes
      title: "Adjusting in the stand, but the chain touches the spokes at the end"
      start: { diagnosis: gears-shift-badly }
      sees:
        derailleur-alignment: straight
        chain-condition: clean
        shift-test-ride: slow-to-smaller
      job_choice: diy
      choices: { hold_bike: stand }
      tutorial_sees:
        barrel-adjuster-present: at-derailleur
        check-high-limit: too-far-out
        check-low-limit-by-hand: in-line
        check-all-gears: chain-off
      after_stop: show_how

    - id: no-barrel-adjuster
      title: "Opens the tutorial directly, but finds no barrel adjuster"
      start: { tutorial: adjust-rear-shifting }
      choices: { hold_bike: stand }
      tutorial_sees:
        derailleur-alignment: straight
        barrel-adjuster-present: none

    - id: routine-check-dirty-chain
      title: "Routine check finds a dirty chain"
      start: { check: routine-check }
      sees:
        derailleur-alignment: straight
        chain-condition: dirty
        shift-test-ride: fine
