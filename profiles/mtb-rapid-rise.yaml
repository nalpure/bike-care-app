# A mountain bike whose parts list says it has a rapid-rise derailleur.
# The app never asks about this; it comes from the bike's data (for example a partner's QR code).

profile:
  id: mtb-rapid-rise
  name: "Mountain bike with a rapid-rise derailleur"
  description: "Added from a partner's parts list, so the derailleur type is known without a question."
  facts:
    bike.category: mtb
    bike.ebike: false
    drive.gear_type: derailleur
    drive.shifting: mechanical
    drive.rear_derailleur_type: low_normal
  answers: {}
  tools: [bike-stand]
  journeys:
    - id: rapid-rise-not-supported
      title: "Gears do not shift cleanly on a rapid-rise derailleur"
      start: { diagnosis: gears-shift-badly }
