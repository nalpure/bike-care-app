# Facts: lasting properties of a bike, stored on the bike and asked at most once.
#
# A fact is asked only when a condition in the user's flow reads it (a route fact).
# Facts used only in placeholders {key|fallback} or in details lines are never asked;
# when they are known, the text becomes more specific (a detail fact).
# Any fact may be unknown. Conditions can test the value unknown explicitly.

facts:
  - key: bike.category
    type: enum
    values: [mtb, road_gravel, trekking_city, cargo]
    safety: false
    question:
      en: "What type of bike is it?"
      de: "Was für ein Fahrradtyp ist es?"
      picture: bike-categories
    help:
      en: "A mountain bike has wide, knobbly tyres and a straight handlebar. A road or gravel bike has narrow tyres and often a curved handlebar. A trekking or city bike is made for everyday rides, often with mudguards, lights and a rack. A cargo bike carries loads in a box or on a long rack."
      de: "Ein Mountainbike hat breite, grobstollige Reifen und einen geraden Lenker. Ein Rennrad oder Gravelbike hat schmale Reifen und oft einen gebogenen Lenker. Ein Trekking- oder Stadtrad ist für den Alltag gemacht, oft mit Schutzblechen, Licht und Gepäckträger. Ein Lastenrad trägt Lasten in einer Kiste oder auf einem langen Gepäckträger."
    answers:
      mtb: { en: "Mountain bike", de: "Mountainbike" }
      road_gravel: { en: "Road or gravel bike", de: "Rennrad oder Gravelbike" }
      trekking_city: { en: "Trekking or city bike", de: "Trekking- oder Stadtrad" }
      cargo: { en: "Cargo bike", de: "Lastenrad" }

  - key: bike.ebike
    type: boolean
    safety: false
    question:
      en: "Is your bike an e-bike?"
      de: "Ist dein Fahrrad ein E-Bike?"
    help:
      en: "An e-bike has a battery, usually on the frame or behind the seat post, and a motor at the pedals or in a wheel hub."
      de: "Ein E-Bike hat einen Akku, meist am Rahmen oder hinter der Sattelstütze, und einen Motor an den Pedalen oder in einer Radnabe."
    answers:
      "true": { en: "Yes, it has a motor", de: "Ja, es hat einen Motor" }
      "false": { en: "No motor", de: "Kein Motor" }

  - key: drive.gear_type
    type: enum
    values: [derailleur, hub_gear, gearbox, single_speed]
    safety: false
    question:
      en: "Which gears does your bike have?"
      de: "Welche Schaltung hat dein Fahrrad?"
      picture: rear-gear-types
    help:
      en: "Look at the rear wheel. Chain and derailleur: several sprockets, and below them a part that guides the chain. Hub gear: one sprocket, and a thick hub in the middle of the wheel. Gearbox: one sprocket at the rear, and a box at the pedals. One gear only: one sprocket, and no shifter."
      de: "Schau dir das Hinterrad an. Kettenschaltung: mehrere Ritzel und darunter ein Teil, das die Kette führt. Nabenschaltung: ein Ritzel und eine dicke Nabe in der Mitte des Rads. Getriebe: hinten ein Ritzel und ein Kasten an den Pedalen. Nur ein Gang: ein Ritzel und kein Schalthebel."
    answers:
      derailleur: { en: "Chain and derailleur", de: "Kettenschaltung" }
      hub_gear: { en: "Hub gear", de: "Nabenschaltung" }
      gearbox: { en: "Gearbox at the pedals", de: "Getriebe an den Pedalen" }
      single_speed: { en: "One gear only", de: "Nur ein Gang" }

  - key: drive.shifting
    type: enum
    values: [mechanical, electronic]
    safety: false
    note: "Only asked when drive.gear_type is derailleur, because conditions test it after the gear type."
    question:
      en: "How is your rear derailleur shifted?"
      de: "Wie wird dein Schaltwerk geschaltet?"
      picture: shifting-types
    help:
      en: "Follow the shifter on the right of the handlebar to the rear derailleur. A thin cable in a housing means it shifts with a cable. A wire with a plug, or no wire at all, means it shifts electronically."
      de: "Folge dem Schalthebel rechts am Lenker bis zum Schaltwerk. Ein dünner Zug in einer Hülle heißt: Es schaltet mit einem Zug. Ein Kabel mit Stecker, oder gar kein Kabel, heißt: Es schaltet elektronisch."
    answers:
      mechanical: { en: "With a cable", de: "Mit einem Schaltzug" }
      electronic: { en: "Electronically", de: "Elektronisch" }

  - key: drive.rear_derailleur_screws
    type: enum
    values: [cross, hex]
    ask: never
    safety: false
    note: "The heads of the limit and B screws. Never asked: it only picks the tool. Known from the bike's parts list or the derailleur model; when unknown, the tools screen shows both tools and how to tell them apart."
    answers:
      cross: { en: "Cross-head screws", de: "Kreuzschlitzschrauben" }
      hex: { en: "Hex screws", de: "Innensechskantschrauben" }

  - key: drive.rear_speeds
    type: number
    safety: false
    note: "Detail fact. Never asked. Used in text when known."

  - key: drive.rear_derailleur_model
    type: text
    safety: false
    note: "Detail fact, for example the model printed on the derailleur. Never asked. Used in text when known."
