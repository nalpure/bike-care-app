# Facts: lasting properties of a bike, stored on the bike and asked at most once.
#
# A fact is asked only when a condition in the user's flow reads it (a route fact).
# Facts used only in placeholders {key|fallback} or in details lines are never asked;
# when they are known, the text becomes more specific (a detail fact).
# Any fact may be unknown. Conditions can test the value unknown explicitly.
# Every fact has a short label for lists (the bike sheet). Its group is the part of the key
# before the first dot; each group has a label and an icon id in fact_groups.
# Number ranges (min, max) are plausible values from typical published bike geometry, for
# checking what the user types. They are not safety values.

fact_groups:
  - { id: bike, label: { en: "Bike", de: "Fahrrad" }, icon: bike }
  - { id: drive, label: { en: "Drivetrain", de: "Antrieb" }, icon: drivetrain }
  - { id: geometry, label: { en: "Geometry", de: "Geometrie" }, icon: geometry }

facts:
  - key: bike.category
    label: { en: "Type", de: "Typ" }
    type: enum
    values: [mtb, road_gravel, trekking_city, cargo]
    safety: false
    question:
      en: "What type of bike is it?"
      de: "Was für ein Fahrradtyp ist es?"
      picture: bike-categories
    help:
      en: "A mountain bike has wide, knobbly tyres and a straight handlebar. A road or gravel bike has narrow tyres and often a curved handlebar. A trekking or city bike is made for everyday rides, often with mudguards, lights and a rack. A cargo bike carries loads in a box or on a long rack."
      de: "Ein Mountainbike hat breite, grobstollige Reifen und einen geraden Lenker. Ein Rennrad oder Gravelbike hat schmale Reifen und oft einen gebogenen Lenker. Ein Trekking- oder Stadtrad ist für den Alltag gemacht, oft mit Schutzblechen, Licht und Gepäckträger. Ein Lastenrad trägt Lasten in einer Kiste oder auf einem langen Gepäckträger."
    answers:
      mtb: { en: "Mountain bike", de: "Mountainbike" }
      road_gravel: { en: "Road or gravel bike", de: "Rennrad oder Gravelbike" }
      trekking_city: { en: "Trekking or city bike", de: "Trekking- oder Stadtrad" }
      cargo: { en: "Cargo bike", de: "Lastenrad" }

  - key: bike.ebike
    label: { en: "E-bike", de: "E-Bike" }
    type: boolean
    safety: false
    question:
      en: "Is your bike an e-bike?"
      de: "Ist dein Fahrrad ein E-Bike?"
    help:
      en: "An e-bike has a battery, usually on the frame or behind the seat post, and a motor at the pedals or in a wheel hub."
      de: "Ein E-Bike hat einen Akku, meist am Rahmen oder hinter der Sattelstütze, und einen Motor an den Pedalen oder in einer Radnabe."
    answers:
      "true": { en: "Yes, it has a motor", de: "Ja, es hat einen Motor" }
      "false": { en: "No motor", de: "Kein Motor" }

  - key: drive.gear_type
    label: { en: "Gears", de: "Schaltung" }
    type: enum
    values: [derailleur, hub_gear, gearbox, single_speed]
    safety: false
    question:
      en: "Which gears does your bike have?"
      de: "Welche Schaltung hat dein Fahrrad?"
      picture: rear-gear-types
    help:
      en: "Look at the rear wheel. Chain and derailleur: several sprockets, and below them a part that guides the chain. Hub gear: one sprocket, and a thick hub in the middle of the wheel. Gearbox: one sprocket at the rear, and a box at the pedals. One gear only: one sprocket, and no shifter."
      de: "Schau dir das Hinterrad an. Kettenschaltung: mehrere Ritzel und darunter ein Teil, das die Kette führt. Nabenschaltung: ein Ritzel und eine dicke Nabe in der Mitte des Rads. Getriebe: hinten ein Ritzel und ein Kasten an den Pedalen. Nur ein Gang: ein Ritzel und kein Schalthebel."
    answers:
      derailleur: { en: "Chain and derailleur", de: "Kettenschaltung" }
      hub_gear: { en: "Hub gear", de: "Nabenschaltung" }
      gearbox: { en: "Gearbox at the pedals", de: "Getriebe an den Pedalen" }
      single_speed: { en: "One gear only", de: "Nur ein Gang" }

  - key: drive.shifting
    label: { en: "Shifting", de: "Schaltart" }
    type: enum
    values: [mechanical, electronic]
    safety: false
    note: "Only asked when drive.gear_type is derailleur, because conditions test it after the gear type."
    question:
      en: "How is your rear derailleur shifted?"
      de: "Wie wird dein Schaltwerk geschaltet?"
      picture: shifting-types
    help:
      en: "Follow the shifter on the right of the handlebar to the rear derailleur. A thin cable in a housing means it shifts with a cable. A wire with a plug, or no wire at all, means it shifts electronically."
      de: "Folge dem Schalthebel rechts am Lenker bis zum Schaltwerk. Ein dünner Zug in einer Hülle heißt: Es schaltet mit einem Zug. Ein Kabel mit Stecker, oder gar kein Kabel, heißt: Es schaltet elektronisch."
    answers:
      mechanical: { en: "With a cable", de: "Mit einem Schaltzug" }
      electronic: { en: "Electronically", de: "Elektronisch" }

  - key: drive.rear_derailleur_screws
    label: { en: "Derailleur screw heads", de: "Schraubenköpfe am Schaltwerk" }
    type: enum
    values: [cross, hex]
    ask: never
    safety: false
    note: "The heads of the limit and B screws. Never asked: it only picks the tool. Known from the bike's parts list or the derailleur model; when unknown, the tools screen shows both tools and how to tell them apart."
    answers:
      cross: { en: "Cross-head screws", de: "Kreuzschlitzschrauben" }
      hex: { en: "Hex screws", de: "Innensechskantschrauben" }

  - key: drive.barrel_adjuster
    label: { en: "Barrel adjuster", de: "Zugeinsteller" }
    type: enum
    values: [derailleur, shifter, inline]
    safety: false
    note: "Where the rear gear cable's barrel adjuster is. Never asked as a question: the check barrel-adjuster-present (and its follow-up barrel-adjuster-search) sets it, and once known the check is not shown again. The 3D view draws the barrel there; inline is drawn in the cable just behind a drop bar, and at the shifter on flat and riser bars."
    answers:
      derailleur: { en: "At the derailleur", de: "Am Schaltwerk" }
      shifter: { en: "At the shifter", de: "Am Schalthebel" }
      inline: { en: "On the cable", de: "Im Schaltzug" }

  - key: drive.rear_speeds
    label: { en: "Rear speeds", de: "Gänge hinten" }
    type: number
    min: 1
    max: 13
    safety: false
    note: "Detail fact: the number of rear sprockets. Never asked. Used in text when known."

  - key: drive.rear_derailleur_model
    label: { en: "Rear derailleur", de: "Schaltwerk" }
    type: text
    safety: false
    note: "Detail fact, for example the model printed on the derailleur. Never asked. Used in text when known."

  - key: drive.shifter_model
    label: { en: "Shifter", de: "Schalthebel" }
    type: text
    safety: false
    note: "Detail fact: the model of the right shifter. Never asked."

  - key: drive.cassette_model
    label: { en: "Sprockets", de: "Kassette" }
    type: text
    safety: false
    note: "Detail fact: the model of the rear sprockets (cassette). Never asked."

  - key: drive.chain_model
    label: { en: "Chain", de: "Kette" }
    type: text
    safety: false
    note: "Detail fact. Never asked."

  - key: drive.crankset_model
    label: { en: "Crankset", de: "Kurbel" }
    type: text
    safety: false
    note: "Detail fact: the model of the cranks and chainrings. Never asked."

  # ------------------------------------------------------------ the bike itself (detail facts, from the garage or the lookup)
  - key: bike.brand
    label: { en: "Brand", de: "Marke" }
    type: text
    safety: false
    note: "Detail fact, for example the name on the down tube. Entered in the garage."

  - key: bike.model
    label: { en: "Model", de: "Modell" }
    type: text
    safety: false
    note: "Detail fact. Entered in the garage."

  - key: bike.line
    label: { en: "Series", de: "Serie" }
    type: text
    safety: false
    note: "Detail fact: the model line or series some brands name between brand and model. Entered in the garage."

  - key: bike.year
    label: { en: "Model year", de: "Modelljahr" }
    type: number
    min: 1970
    max: 2030
    safety: false
    note: "Detail fact. Entered in the garage. Raise max when model years pass 2030."

  - key: bike.handlebar
    label: { en: "Handlebar", de: "Lenker" }
    type: enum
    values: [drop, flat, riser]
    safety: false
    note: "Detail fact. The 3D view draws the bar from it. Unknown is the general unknown value."
    answers:
      drop: { en: "Drop bar, curved down", de: "Rennlenker, nach unten gebogen" }
      flat: { en: "Flat bar", de: "Gerader Lenker" }
      riser: { en: "Riser bar, bent up at the ends", de: "Riser-Lenker, an den Enden nach oben gebogen" }

  - key: bike.colour
    label: { en: "Frame colour", de: "Rahmenfarbe" }
    type: text
    safety: false
    note: "Detail fact: the frame colour as #rrggbb, chosen in the garage. The 3D view paints the frame with it."

  # ------------------------------------------------------------ geometry (detail facts, in mm and degrees)
  # Ranges: typical manufacturer geometry tables for road, gravel, mountain, trekking and city
  # bikes in sizes XS to XXL, kept in line with GEOMETRY_RANGES in player/src/stage/bike.ts.
  # Cargo bikes can fall outside wheelbase and chainstay.
  - key: geometry.stack_mm
    label: { en: "Stack", de: "Stack" }
    type: number
    unit: mm
    min: 450
    max: 720
    safety: false

  - key: geometry.reach_mm
    label: { en: "Reach", de: "Reach" }
    type: number
    unit: mm
    min: 330
    max: 520
    safety: false

  - key: geometry.head_tube_mm
    label: { en: "Head tube", de: "Steuerrohr" }
    type: number
    unit: mm
    min: 80
    max: 260
    safety: false

  - key: geometry.seat_tube_mm
    label: { en: "Seat tube", de: "Sitzrohr" }
    type: number
    unit: mm
    min: 330
    max: 640
    safety: false

  - key: geometry.top_tube_mm
    label: { en: "Top tube (effective)", de: "Oberrohr (effektiv)" }
    type: number
    unit: mm
    min: 480
    max: 700
    safety: false
    note: "Effective (horizontal) top tube length."

  - key: geometry.chainstay_mm
    label: { en: "Chainstay", de: "Kettenstrebe" }
    type: number
    unit: mm
    min: 390
    max: 520
    safety: false

  - key: geometry.wheelbase_mm
    label: { en: "Wheelbase", de: "Radstand" }
    type: number
    unit: mm
    min: 900
    max: 1400
    safety: false

  - key: geometry.bb_drop_mm
    label: { en: "BB drop", de: "Tretlagerabsenkung" }
    type: number
    unit: mm
    min: 0
    max: 90
    safety: false
    note: "Bottom bracket drop: how far the bottom bracket sits below the wheel axles."

  - key: geometry.head_angle_deg
    label: { en: "Head angle", de: "Lenkwinkel" }
    type: number
    unit: deg
    min: 62
    max: 76
    safety: false

  - key: geometry.seat_angle_deg
    label: { en: "Seat angle", de: "Sitzwinkel" }
    type: number
    unit: deg
    min: 68
    max: 79
    safety: false

  - key: geometry.wheel_bsd_mm
    label: { en: "Wheel size", de: "Laufradgröße" }
    type: number
    unit: mm
    values: [559, 584, 622]
    safety: false
    note: "ISO bead seat diameter of the rims."
    answers:
      "559": { en: "26 inch (559 mm)", de: "26 Zoll (559 mm)" }
      "584": { en: "27.5 inch, 650B (584 mm)", de: "27,5 Zoll, 650B (584 mm)" }
      "622": { en: "28 or 29 inch, 700C (622 mm)", de: "28 oder 29 Zoll, 700C (622 mm)" }
