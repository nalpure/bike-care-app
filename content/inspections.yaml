# Shared inspections: a look, listen or feel that reports one of two or three named states.
# Used by diagnoses, the routine check and tutorials.
#
# hands_off: true means the inspection takes nothing apart and changes nothing on the bike.
# Only those may be used by a diagnosis or the routine check.
# leads_to on a state is routing data (job and urgency). Labels and meanings stay neutral.
#
# All mechanics here are unverified drafts. Doubts: content/review/adjust-rear-shifting.md

inspections:
  - id: derailleur-alignment
    title: "Look at the rear derailleur"
    applies_when: { drive.gear_type: [derailleur] }
    hands_off: true
    minutes: 1
    text: "Stand behind the bike and look at the rear derailleur, the part below the sprockets that guides the chain."
    focus: [derailleur_hanger]
    show: [rear_derailleur, cassette, rear_end]
    view: hanger_from_behind
    animation: { clip: hanger-bend, caption: "A bent hanger tilts the derailleur" }
    states:
      - id: straight
        label: "It hangs straight down, in line with the sprockets"
        meaning: "The derailleur does not look bent."
      - id: crooked
        label: "It leans towards the spokes, or looks twisted"
        meaning: "The derailleur or the part that holds it may be bent."
        leads_to: { job: derailleur-check-at-shop, urgency: do_not_ride }

  - id: barrel-adjuster-present
    title: "Find the barrel adjuster"
    applies_when: { drive.gear_type: [derailleur] }
    hands_off: true
    minutes: 1
    text: "Find the barrel adjuster: a small ribbed knob where the gear cable goes in. Look at the rear derailleur, then at the right shifter. If there is one at both, pick either."
    question: "Where is it?"
    focus: [barrel_adjuster, shift_cable]
    show: [rear_derailleur, derailleur_hanger, rear_end]
    view: barrel_adjuster_close
    states:
      - id: at-derailleur
        label: "At the derailleur"
        meaning: "The cable tension can be set at the derailleur."
        sets: { drive.barrel_adjuster: derailleur }
      - id: at-shifter
        label: "At the shifter"
        meaning: "The cable tension can be set at the shifter. It works the same way."
        sets: { drive.barrel_adjuster: shifter }
      - id: cant-find
        label: "I cannot find it"
        meaning: "Look along the cable next."

  # Follow-up of barrel-adjuster-present, shown only after "I cannot find it".
  - id: barrel-adjuster-search
    title: "Look along the cable"
    applies_when: { drive.gear_type: [derailleur] }
    hands_off: true
    minutes: 1
    text: "Follow the gear cable from the right shifter to the rear derailleur. On some bikes the barrel adjuster sits in the cable itself: a small ribbed knob, often near the handlebar."
    question: "Found it?"
    focus: [shift_cable]
    show: [frame, handlebar, shifter_rear, rear_derailleur]
    view: drive_side
    states:
      - id: on-cable
        label: "It is on the cable"
        meaning: "The cable tension can be set there. It works the same way."
        sets: { drive.barrel_adjuster: inline }
      - id: not-found
        label: "I still cannot find it"
        meaning: "This bike may have no barrel adjuster."

  - id: chain-condition
    title: "Look at the chain"
    applies_when: { drive.gear_type: [derailleur, hub_gear, gearbox, single_speed] }
    hands_off: true
    minutes: 1
    text: "Look at the chain below the pedals. Turn the pedals backwards slowly to see all of it."
    focus: [chain]
    view: chain_close
    animation: { target: crank, motion: rotate, direction: backward, amount: "slowly, two full turns", caption: "Turn the pedals backwards" }
    states:
      - id: clean
        label: "Clean, with a thin film of oil"
        meaning: "The chain looks cared for."
      - id: dry-or-rusty
        label: "Dry, rusty, or it squeaks"
        meaning: "The chain needs cleaning and oil. If the gears still shift badly afterwards, check again."
        leads_to: { job: chain-care, urgency: soon }
      - id: dirty
        label: "Black and gritty"
        meaning: "The chain needs cleaning and oil. If the gears still shift badly afterwards, check again."
        leads_to: { job: chain-care, urgency: soon }

  - id: shift-test-ride
    title: "Test ride the gears"
    applies_when: { drive.gear_type: [derailleur] }
    hands_off: true
    minutes: 3
    text: "Ride slowly on a quiet, flat path. Use only the right shifter and change one gear at a time, all the way up and down. Every gear should change quickly and run quietly."
    default: fine
    question: "Slow or rattling?"
    focus: [chain]
    show: [frame, fork, front_wheel, rear_wheel, handlebar, brake_lever, shifter_rear, saddle, seat_post, shift_cable, drivetrain]
    view: drive_side
    animation: { clip: shift-test-ride, caption: "Shift one gear at a time while you ride" }
    states:
      - id: slow-to-bigger
        label: "Slow or rattling when shifting to easier gears"
        meaning: "The chain is slow to climb to the bigger sprockets, the easier gears."
        leads_to: { job: adjust-rear-shifting, urgency: soon }
      - id: slow-to-smaller
        label: "Slow or rattling when shifting to harder gears"
        meaning: "The chain is slow to drop to the smaller sprockets, the harder gears."
        leads_to: { job: adjust-rear-shifting, urgency: soon }
      - id: fine
        label: "Every gear changes quickly and runs quietly"
        meaning: "The rear gears shift well."
