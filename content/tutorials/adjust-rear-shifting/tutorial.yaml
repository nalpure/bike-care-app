# Adjust the rear gears (mechanical rear derailleur).
# Golden example for the content format. Mechanics are unverified drafts:
# see content/review/adjust-rear-shifting.md.
#
# Branch 1, by mechanism: only a mechanical derailleur is covered.
# Branch 2, nested, by how the bike is held: with the rear wheel free the user turns the pedals
# by hand; on its wheels the user adjusts between short test rides. The order of work differs,
# which is the one case where approach.md allows a nested branch.

tutorial:
  id: adjust-rear-shifting
  job: adjust-rear-shifting
  difficulty: 2
  choices: [hold_bike]
  # Run before the work in every case. After a diagnosis that already looked, they are not shown again.
  checks:
    - inspect: derailleur-alignment
      outcomes:
        straight: continue
        crooked:
          exit:
            kind: unsafe
            text: "Do not ride. The derailleur or the part that holds it may be bent, and it can catch in the spokes. Take the bike to a shop."
    - inspect: barrel-adjuster-present
      outcomes:
        at-derailleur: continue
        at-shifter-or-cable: continue
        none:
          exit:
            kind: not_covered
            text: "Bikes without a barrel adjuster are not supported yet. A shop can set the gear cable for you."
  cases:
    - when: { drive.gear_type: [derailleur], drive.shifting: [mechanical] }
      cases:
        - when: { choice.hold_bike: [stand, hang, upside_down] }
          include: cases/wheel-free.yaml
        - when: { choice.hold_bike: [ground] }
          include: cases/test-rides.yaml
    - when: { drive.gear_type: [derailleur], drive.shifting: [electronic] }
      exit: { kind: not_covered, text: "Electronic shifting is not covered yet. It is adjusted with the maker's app or buttons, not with a cable." }
    - when: { drive.gear_type: [derailleur], drive.shifting: [unknown] }
      exit: { kind: not_covered, text: "We need to know whether your gears use a cable before this guide can help. Look at the right shifter and come back, or find a shop." }
    - when: { drive.gear_type: [hub_gear] }
      exit: { kind: not_covered, text: "Hub gears are not covered yet. They are adjusted differently from gears with a derailleur." }
    - when: { drive.gear_type: [gearbox] }
      exit: { kind: not_covered, text: "Gearboxes at the pedals are not covered yet." }
    - when: { drive.gear_type: [single_speed] }
      exit: { kind: not_covered, text: "Your bike has only one gear, so there is nothing to adjust here. If the chain is loose or skips, a shop can help." }
    - when: { drive.gear_type: [unknown] }
      exit: { kind: not_covered, text: "We need to know what kind of gears your bike has before this guide can help. Look at the rear wheel and come back, or find a shop." }
  if_unknown: ask
