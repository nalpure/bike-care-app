# Mechanical rear derailleur, bike on its wheels. The user adjusts while the bike stands
# and tests with short rides. Limit screws by the owner's method (2026-11-20): H after a ride
# into the smallest sprocket, L after a ride into the largest, then the hand push double-checks
# the inner limit. The ride into the largest sprocket warns to stop pedalling at once if the
# chain moves towards the spokes.

# The tutorial's checks (tutorial.yaml) run first.
sequence:
  - step: park-bike
  - step: ride-to-smallest-sprocket
  - step: check-high-limit
  - step: ride-to-largest-sprocket
  - step: check-low-limit
  - step: check-low-limit-by-hand        # double-check of the inner limit
  - step: check-b-gap
  - step: check-cable-tension-riding

finish:
  - step: test-ride-gears                # safety check; both problems end at a shop
