# Mechanical rear derailleur, bike on its wheels. The user adjusts while the bike stands
# and tests with short rides. The low limit is checked by hand before the first ride,
# because a loose low limit can throw the chain into the spokes while riding.

sequence:
  # Nothing is apart in this case, so no stop has a jump button.
  - inspect: derailleur-alignment
    outcomes:
      straight: continue
      crooked:
        exit:
          kind: unsafe
          text: "Do not ride. The derailleur or the part that holds it may be bent, and it can catch in the spokes. Take the bike to a shop."
  - inspect: barrel-adjuster-present
    outcomes:
      at-derailleur: continue
      at-shifter-or-cable: continue
      none:
        exit:
          kind: not_covered
          text: "Bikes without a barrel adjuster are not supported yet. A shop can set the gear cable for you."
  - step: park-bike
  - step: check-low-limit-by-hand        # block while the pulley goes past the largest sprocket
  - step: ride-to-smallest-sprocket
  - step: check-high-limit
  - step: ride-to-largest-sprocket
  - step: check-b-gap
  - step: check-cable-tension-riding
  - step: check-all-gears-riding
