# Mechanical rear derailleur, rear wheel off the ground (stand, hanging, or upside down).
# The low limit is checked by hand first, before the chain is ever shifted towards the spokes,
# and independent of the cable tension (review finding, 2026-11-17).

sequence:
  # Nothing is apart yet: a stop here has no jump button.
  - inspect: derailleur-alignment
    outcomes:
      straight: continue
      crooked:
        stop: "Do not ride. The derailleur or the part that holds it may be bent, and it can catch in the spokes. Take the bike to a shop."
  - inspect: barrel-adjuster-present
    outcomes:
      at-derailleur: continue
      at-shifter-or-cable: continue
      none:
        stop: "Bikes without a barrel adjuster are not supported yet. A shop can set the gear cable for you."

  # The work
  - procedure: hold-bike                 # sets bike_in_stand, bike_hung or bike_upside_down
  - step: check-low-limit-by-hand        # block while the derailleur goes past the largest sprocket
  - step: shift-to-smallest-sprocket
  - step: check-high-limit               # block while the derailleur sits outside the smallest sprocket
  - step: shift-to-largest-sprocket
  - step: check-b-gap
  - step: check-cable-tension
  - step: check-all-gears                # its stop: show_how_from release-bike
  - procedure: release-bike              # clears the holding label

finish:
  - inspect: shift-test-ride
    outcomes:
      fine: continue
      slow-to-bigger:
        stop: "Your gears still do not shift cleanly. You can ride carefully, but the cable may be worn or dirty. A shop can check it."
      slow-to-smaller:
        stop: "Your gears still do not shift cleanly. You can ride carefully, but the cable may be worn or dirty. A shop can check it."
