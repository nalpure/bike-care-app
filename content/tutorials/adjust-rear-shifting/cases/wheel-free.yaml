# Mechanical rear derailleur, rear wheel off the ground (stand, hanging, or upside down).
# Limit screws by the owner's method (2026-11-20): H at the smallest sprocket, L at the largest,
# then the hand push towards the spokes double-checks the inner limit.

# The tutorial's checks (tutorial.yaml) run first.
sequence:
  - procedure: hold-bike                 # sets bike_in_stand, bike_hung or bike_upside_down
  - step: shift-to-smallest-sprocket
  - step: check-high-limit               # block while the derailleur sits outside the smallest sprocket
  - step: shift-to-largest-sprocket
  - step: check-low-limit                # block while the derailleur sits past the largest sprocket
  - step: check-low-limit-by-hand        # double-check: block while a push takes it past the largest sprocket
  - step: check-b-gap
  - step: check-cable-tension
  - step: check-all-gears                # its unsafe exit: show_how_from release-bike
  - procedure: release-bike              # clears the holding label

finish:
  - inspect: shift-test-ride
    outcomes:
      fine: continue
      slow-to-bigger:
        exit:
          kind: shop_only
          text: "Your gears still do not shift cleanly. You can ride carefully, but the cable may be worn or dirty. A shop can check it."
      slow-to-smaller:
        exit:
          kind: shop_only
          text: "Your gears still do not shift cleanly. You can ride carefully, but the cable may be worn or dirty. A shop can check it."
