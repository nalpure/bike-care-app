# Steps for adjusting a mechanical rear derailleur.
# Raw material: the prototype in legacy/Bikefix-garage-guide v2.html, rewritten to the writing rules.
# All mechanics are unverified drafts. Doubts: content/review/adjust-rear-shifting.md
#
# Turn directions are written as "screw in" and "unscrew", not clockwise, because the
# direction you see depends on where you look from.

steps:
  # ------------------------------------------------------------ rear wheel off the ground
  - id: shift-to-smallest-sprocket
    kind: action
    minutes: 1
    text: "Turn the pedals forward by hand and use the right shifter until the chain sits on the smallest sprocket."
    focus: [shifter_rear, smallest_sprocket, chain]
    view: drive_side
    animation: { clip: shift-to-smallest, caption: "Shift while the pedals turn" }

  - id: shift-to-largest-sprocket
    kind: action
    minutes: 1
    text: "Turn the pedals by hand and shift one gear at a time until the chain sits on the largest sprocket. Stop shifting if the chain moves past it towards the spokes."
    focus: [shifter_rear, largest_sprocket, chain]
    view: drive_side
    animation: { clip: shift-to-largest, caption: "Shift one gear at a time" }

  - id: check-cable-tension
    kind: check
    minutes: 5
    text: "Turn the pedals by hand and shift one gear at a time, up through all gears and back. Watch the chain."
    focus: [barrel_adjuster, chain, cassette]
    view: drive_side
    buttons:
      - label: "Slow or noisy going to bigger sprockets"
        text: "The cable is too loose. Unscrew the barrel adjuster a quarter turn, then shift again."
        solution:
          - { clip: cable-tension-shift, view: barrel_adjuster_close, caption: "Unscrew the barrel adjuster a quarter turn" }
      - label: "Slow or noisy going to smaller sprockets"
        text: "The cable is too tight. Screw in the barrel adjuster a quarter turn, then shift again."
        solution:
          - { clip: cable-tension-shift, view: barrel_adjuster_close, caption: "Screw in the barrel adjuster a quarter turn" }
      - label: "Every shift is quick and quiet"
        text: "The cable tension is right."

  - id: check-all-gears
    kind: safety_check
    minutes: 2
    text: "Turn the pedals and shift through every gear, from the smallest sprocket to the largest and back. Watch and listen."
    details:
      - needs: [drive.rear_speeds]
        text: "Your bike has {drive.rear_speeds} gears at the rear."
    focus: [cassette, chain, rear_derailleur]
    view: drive_side
    buttons:
      - label: "Every gear runs quietly"
        text: "Your rear gears are set."
      - label: "It rattles or jumps in some gears"
        text: "Turn the barrel adjuster a quarter turn, as in the earlier step, and shift through again. If it does not get better, a shop can check the cable."
      - label: "The chain falls off, or touches the spokes"
        stop: "Do not ride: the chain can catch in the spokes and lock the wheel. Put the bike back on its wheels and take it to a shop."
        show_how_from: release-bike

  # ------------------------------------------------------------ bike on its wheels, test rides
  - id: check-low-limit-by-hand
    kind: safety_check
    minutes: 3
    text: "Push the rear derailleur by hand towards the spokes, as far as it goes. Look from behind: where does the upper pulley wheel stop?"
    tools: { required: [derailleur-screw-tool], helpful: [] }
    focus: [rear_derailleur, upper_pulley, largest_sprocket, l_screw]
    view: derailleur_from_behind
    animation: { target: rear_derailleur, motion: push, direction: "towards the spokes", amount: "as far as it goes", caption: "Push the derailleur in by hand" }
    buttons:
      - label: "Straight below the largest sprocket"
        text: "The L screw is set. Let go of the derailleur."
      - label: "Past the largest sprocket, towards the spokes"
        block: "Do not ride like this: the chain can fall into the spokes. Screw in the screw marked L a quarter turn, then push and look again."
        solution:
          - { target: l_screw, motion: rotate, direction: "screw in", amount: "a quarter turn", view: derailleur_from_behind, caption: "Screw in the L screw a quarter turn" }
      - label: "It stops before the largest sprocket"
        text: "The chain may not reach the largest sprocket. Unscrew the screw marked L a quarter turn, then push and look again."
        solution:
          - { target: l_screw, motion: rotate, direction: "unscrew", amount: "a quarter turn", view: derailleur_from_behind, caption: "Unscrew the L screw a quarter turn" }

  - id: ride-to-smallest-sprocket
    kind: action
    minutes: 2
    text: "Ride slowly on a quiet path and shift into the hardest gear, the smallest sprocket. Stop, and park the bike as before."
    forbidden_while: [bike_in_stand, bike_hung, bike_upside_down]
    focus: [shifter_rear, smallest_sprocket]
    view: drive_side

  - id: ride-to-largest-sprocket
    kind: action
    minutes: 2
    text: "Ride slowly and shift one gear at a time into the easiest gear, the largest sprocket. Stop, and park the bike as before."
    forbidden_while: [bike_in_stand, bike_hung, bike_upside_down]
    focus: [shifter_rear, largest_sprocket]
    view: drive_side

  - id: check-cable-tension-riding
    kind: check
    minutes: 10
    text: "Ride slowly and shift one gear at a time, up through all gears and back. Stop before you change anything."
    forbidden_while: [bike_in_stand, bike_hung, bike_upside_down]
    focus: [barrel_adjuster, chain, cassette]
    view: drive_side
    buttons:
      - label: "Slow or noisy going to easier gears"
        text: "The cable is too loose. Park the bike, unscrew the barrel adjuster a quarter turn, then ride and shift again."
        solution:
          - { clip: cable-tension-shift, view: barrel_adjuster_close, caption: "Unscrew the barrel adjuster a quarter turn" }
      - label: "Slow or noisy going to harder gears"
        text: "The cable is too tight. Park the bike, screw in the barrel adjuster a quarter turn, then ride and shift again."
        solution:
          - { clip: cable-tension-shift, view: barrel_adjuster_close, caption: "Screw in the barrel adjuster a quarter turn" }
      - label: "Every shift is quick and quiet"
        text: "The cable tension is right."

  - id: check-all-gears-riding
    kind: safety_check
    minutes: 3
    text: "Ride once more and shift through every gear, from the hardest to the easiest and back. Watch and listen."
    forbidden_while: [bike_in_stand, bike_hung, bike_upside_down]
    details:
      - needs: [drive.rear_speeds]
        text: "Your bike has {drive.rear_speeds} gears at the rear."
    focus: [cassette, chain, rear_derailleur]
    view: drive_side
    buttons:
      - label: "Every gear runs quietly"
        text: "Your rear gears are set."
      - label: "It rattles or jumps in some gears"
        text: "Park the bike, turn the barrel adjuster a quarter turn as in the earlier step, and ride again. If it does not get better, a shop can check the cable."
      - label: "The chain falls off, or touches the spokes"
        stop: "Stop riding: the chain can catch in the spokes and lock the wheel. Push the bike to a shop."

  # ------------------------------------------------------------ used in both ways of holding the bike
  - id: check-high-limit
    kind: check
    minutes: 3
    text: "Look from directly behind the bike. Where is the upper pulley wheel of the derailleur, compared with the smallest sprocket?"
    tools: { required: [derailleur-screw-tool], helpful: [torch] }
    focus: [upper_pulley, smallest_sprocket, h_screw]
    view: derailleur_from_behind
    buttons:
      - label: "Straight below the sprocket"
        text: "The H screw is set. Nothing to change."
      - label: "Further in, towards the spokes"
        text: "Unscrew the screw marked H a quarter turn at a time, until the pulley sits straight below the sprocket."
        solution:
          - { clip: limit-screw-align, caption: "Unscrew the H screw a quarter turn" }
      - label: "Further out, away from the spokes"
        text: "The chain could fall off the outside. Screw in the screw marked H a quarter turn at a time, until the pulley sits straight below the sprocket."
        solution:
          - { clip: limit-screw-align, caption: "Screw in the H screw a quarter turn" }

  - id: check-low-limit
    kind: safety_check
    minutes: 3
    text: "Look from directly behind the bike again. Where is the upper pulley wheel, compared with the largest sprocket?"
    tools: { required: [derailleur-screw-tool], helpful: [torch] }
    focus: [upper_pulley, largest_sprocket, l_screw]
    view: derailleur_from_behind
    buttons:
      - label: "Straight below the sprocket"
        text: "The L screw is set. Nothing to change."
      - label: "Further in, towards the spokes"
        block: "Do not ride like this: the chain can fall into the spokes. Screw in the screw marked L a quarter turn at a time, until the pulley sits straight below the sprocket."
        solution:
          - { clip: limit-screw-align, caption: "Screw in the L screw a quarter turn" }
      - label: "Further out, it does not reach"
        text: "The chain cannot reach the largest sprocket. Unscrew the screw marked L a quarter turn at a time, until the pulley sits straight below the sprocket."
        solution:
          - { clip: limit-screw-align, caption: "Unscrew the L screw a quarter turn" }

  - id: check-b-gap
    kind: check
    minutes: 3
    text: "Keep the chain on the largest sprocket. Look from the side at the gap between the upper pulley wheel and the sprocket."
    tools: { required: [derailleur-screw-tool], helpful: [torch] }
    focus: [upper_pulley, largest_sprocket, b_screw]
    view: derailleur_side_close
    buttons:
      - label: "A small gap, the teeth do not touch"
        text: "The gap is fine. The manual for {drive.rear_derailleur_model|your derailleur} gives the exact gap, if you want to check it."
      - label: "The pulley touches the sprocket, or almost"
        text: "Screw in the B screw, at the back of the derailleur, a little at a time until there is a small gap."
        solution:
          - { clip: b-gap-adjust, caption: "Screw in the B screw a little" }
      - label: "A big gap, and shifting here was slow"
        text: "Unscrew the B screw a little at a time, until the gap is small but the teeth do not touch."
        solution:
          - { clip: b-gap-adjust, caption: "Unscrew the B screw a little" }

  - id: find-barrel-adjuster
    kind: action
    minutes: 1
    text: "Find the barrel adjuster: a small ribbed knob where the gear cable enters the derailleur, or where it leaves the right shifter."
    focus: [barrel_adjuster, shift_cable]
    view: barrel_adjuster_close
