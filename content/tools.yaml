# Tool catalog and parts.
# Tools are picked fresh for each run. Parts are bought and fitted.
# A step lists a tool only when its text names it: by its name or one of its mentions.

tools:
  - id: bike-stand
    name: "Bike work stand"
    kind: tool
    mentions: [stand]

  - id: hook-or-rope
    name: "Strong hook or rope that can carry the bike"
    kind: tool
    mentions: [hook or rope]

  - id: work-mat
    name: "Soft mat or old blanket"
    kind: tool
    mentions: [mat, blanket]
    substitutes:
      - { name: "Flattened cardboard box" }

  - id: small-cross-screwdriver
    name: "Small cross-head screwdriver"
    kind: tool
    mentions: [screwdriver]
    substitutes:
      - { name: "Bike multi-tool with a small cross-head bit" }

  - id: small-hex-keys
    name: "Small hex keys"
    kind: tool
    mentions: [hex key]
    substitutes:
      - { name: "Bike multi-tool with small hex keys" }

# One of these, depending on your part. The bike's data may say which one fits.
tool_sets:
  - id: derailleur-screw-tool
    name: "A tool for the small screws on the rear derailleur"
    tell_apart: "Look at the small screws on the back of the rear derailleur. A cross in the screw head needs the screwdriver. A six-sided hole needs a hex key."
    options:
      - { tool: small-cross-screwdriver, when: { drive.rear_derailleur_screws: [cross] } }
      - { tool: small-hex-keys, when: { drive.rear_derailleur_screws: [hex] } }

parts: []
