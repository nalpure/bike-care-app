# Symptom: "My gears don't shift cleanly" (rear gears).
# Checks run in order; the first state that leads to a job ends the diagnosis.
# Order: the bent-derailleur look comes first because the shift test is a ride,
# and a bent derailleur must not be ridden. Then the chain, then the ride.

diagnosis:
  id: gears-shift-badly
  symptom: "My gears don't shift cleanly"
  covers_like: adjust-rear-shifting        # the same bikes as the job, with its not-covered texts
  checks:
    - inspect: derailleur-alignment
    - inspect: chain-condition
    - inspect: shift-test-ride
  no_hit: { job: derailleur-check-at-shop }
