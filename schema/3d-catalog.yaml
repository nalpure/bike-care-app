# Named 3D nodes, camera views and animation clips that content may refer to.
#
# Seeded by hand from the prototype (legacy/Bikefix-garage-guide v2.html: META, tag anchors and
# the animation functions alignAnim, gapAnim, shiftAnim). Names are snake_case for nodes and views,
# kebab-case for clips.
#
# The player now exports build/3d-manifest.json from player/src/stage/registry.ts (npm run manifest),
# and npm run check uses that manifest instead of this file (AC-27). This file stays as the list
# the player must at least provide: player/test/stage.test.ts fails when a name here is missing.
# Add a name here only together with a note in docs/schema-requests.md.

nodes:
  - bike
  - frame
  - fork
  - front_wheel
  - rear_wheel
  - saddle
  - seat_post
  - handlebar
  - kickstand
  - stand_clamp
  - chainring
  - crank
  - chain
  - cassette
  - smallest_sprocket
  - largest_sprocket
  - rear_derailleur
  - derailleur_hanger
  - upper_pulley
  - h_screw
  - l_screw
  - b_screw
  - barrel_adjuster
  - shift_cable
  - shifter_rear

views:
  - whole_bike
  - drive_side
  - derailleur_from_behind
  - derailleur_side_close
  - barrel_adjuster_close
  - handlebar_from_above
  - chain_close

clips:
  - shift-to-smallest       # prototype step 1: chain walks down the cassette while the cranks turn
  - shift-to-largest
  - limit-screw-align       # prototype alignAnim: pulley moves under the target sprocket as a screw turns
  - b-gap-adjust            # prototype gapAnim: pulley moves towards or away from the largest sprocket
  - cable-tension-shift     # prototype shiftAnim: barrel turns, chain follows the shifter one sprocket

motions: [rotate, push, pull, slide, squeeze, remove, insert]
