<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Bikefix Garage Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: app shell with five tabs (Repair, Garage, Shop, Workshops, Ask). Repair opens a wizard (bike, tools) that ends in the pinned 3D guide. */
:root {
  --bg: #E9EDF0;
  --panel: #F7F9FA;
  --ink: #14202A;
  --ink2: #4F5E6A;
  --line: #C9D2D8;
  --accent: #F2B600;
  --accent-ink: #1A1500;
  --accent-text: #7A5800;
  --good: #1E9E5A;
  --bad: #D6453D;
  --stage: #DCE3E8;
  --stage2: #C9D4DB;
  --part: #5C6D7B;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --panel: #151E26; --ink: #E8EEF2; --ink2: #9AA9B5; --line: #28343E;
    --accent: #FFC71F; --accent-ink: #1A1500; --accent-text: #FFC71F;
    --good: #34C77B; --bad: #FF6B5E;
    --stage: #0A1015; --stage2: #18232C; --part: #8998A5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --panel: #151E26; --ink: #E8EEF2; --ink2: #9AA9B5; --line: #28343E;
  --accent: #FFC71F; --accent-ink: #1A1500; --accent-text: #FFC71F;
  --good: #34C77B; --bad: #FF6B5E;
  --stage: #0A1015; --stage2: #18232C; --part: #8998A5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  overflow: hidden; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }

/* ---------- shell ---------- */
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-block: 8px 20px; display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch; }
.h1 { font-family: var(--f-display); font-weight: 700; font-size: 32px; line-height: 1.02; letter-spacing: .005em; text-wrap: balance; }
.lead { color: var(--ink2); font-size: 15.5px; max-width: 60ch; }
.eyebrow { font: 500 11px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.brandrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 8px; flex: none; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; line-height: 1; }
.demo { font: 500 10px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); border: 1px solid var(--line); padding: 5px 7px; border-radius: 6px; }

.tabbar { flex: none; display: flex; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-inline: max(8px, env(safe-area-inset-left, 0px)) max(8px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); background: var(--panel); }
.tabbar button { flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: none; font: 600 12px/1 var(--f-body); color: var(--ink2); position: relative; }
.tabbar svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tabbar .pro { position: absolute; top: 5px; right: calc(50% - 26px); font: 500 8px/1 var(--f-mono); letter-spacing: .05em; padding: 3px 4px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); }

.wh { display: flex; align-items: center; gap: 6px; padding-block: 6px 2px; flex: none; margin-left: -8px; }
.wh .t { flex: 1; min-width: 0; }
.wh .t b { display: block; font-family: var(--f-display); font-size: 22px; line-height: 1.05; }
.wh .t small { display: block; font: 500 11px/1.2 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
.ib { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; background: none; border-radius: 12px; }
.ib svg, .fab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.cta { flex: none; padding-block: 10px 12px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); }
.cta small { color: var(--ink2); font-size: 13px; text-align: center; }
.btn { min-height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 16px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.link { background: none; border: 0; padding: 8px 0; text-decoration: underline; color: var(--ink2); font-size: 14px; }

/* ---------- lists, cards, forms ---------- */
.list { border-top: 1px solid var(--line); }
.list li { border-bottom: 1px solid var(--line); }
.li { width: 100%; min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 2px; border: 0; background: none; text-align: left; }
.li .tx { flex: 1; min-width: 0; }
.li .tx b { display: block; font-size: 17px; line-height: 1.25; }
.li .tx span { display: block; font-size: 14px; color: var(--ink2); }
.badge { flex: none; font: 500 10px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 7px; border-radius: 6px; background: var(--stage2); color: var(--ink2); }
.badge.ready { background: var(--accent); color: var(--accent-ink); }
.badge.warn { background: color-mix(in srgb, var(--bad) 18%, var(--panel)); color: var(--ink); }
.search { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); padding: 0 14px; }

.card { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
button.card { width: 100%; text-align: left; }
.card .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card b { font-family: var(--f-display); font-size: 22px; line-height: 1.05; }
.card span.s { font-size: 14px; color: var(--ink2); }
.bikes { display: flex; flex-direction: column; gap: 10px; }
.note { border-radius: 10px; padding: 10px 12px; font-size: 14px; background: color-mix(in srgb, var(--accent) 16%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); }

.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .lbl { font-weight: 600; font-size: 15px; }
.field .help { font-size: 13.5px; color: var(--ink2); }
.field.need > .lbl::after, .field.need > label::after { content: "Needed"; margin-left: 8px; font: 500 10px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 3px 5px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); vertical-align: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cb { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 15px; }
.cb[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips.nums .cb { min-width: 46px; padding: 0 10px; }
.text { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); padding: 0 14px; width: 100%; }

.tick { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 2px; border: 0; background: none; text-align: left; min-height: 58px; }
.tick .box { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--ink2); display: grid; place-items: center; }
.tick .box svg { width: 16px; height: 16px; stroke: var(--accent-ink); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.tick[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
.tick[aria-checked="true"] .box svg { opacity: 1; }
.tick .tx { flex: 1; min-width: 0; }
.tick .tx b { display: block; font-size: 16px; line-height: 1.25; }
.tick .tx span { display: block; font-size: 13.5px; color: var(--ink2); }
.tools-group { border-top: 1px solid var(--line); }
.tools-group > .row { border-bottom: 1px solid var(--line); display: flex; align-items: center; }
.tools-group > .row .tick { flex: 1; }
.tools-group .getit { flex: none; font-size: 13.5px; padding: 10px 4px; min-height: 44px; }

/* ---------- chat ---------- */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 12px; border-radius: 14px; font-size: 15.5px; line-height: 1.4; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; display: flex; flex-direction: column; gap: 8px; }
.msg .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.msg .acts .btn { min-height: 40px; font-size: 14px; padding: 0 12px; }
.sugg { display: flex; flex-wrap: wrap; gap: 8px; }
.sugg .cb { font-size: 14px; font-weight: 400; }
.chatin { display: flex; gap: 8px; }

/* ---------- shop and workshops ---------- */
.shoprow { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; padding: 6px 0; border-top: 1px dashed var(--line); }
.shoprow:first-of-type { border-top: 0; }
.shoprow span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.total { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.tag2 { font: 500 10px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px; border-radius: 5px; background: var(--stage2); }

.toast { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(8, 12, 16, .55); display: flex; align-items: flex-end; justify-content: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal .card { width: 100%; max-width: 460px; }

/* ---------- guide ---------- */
.gtop { flex: none; display: flex; align-items: center; gap: 6px; padding-block: 4px; margin-left: -8px; }
.gtop .t { flex: 1; min-width: 0; font: 500 11px/1.25 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggle { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 600; }
.toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.app { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
.stage {
  position: relative; flex: 0 0 clamp(150px, 30%, 330px); min-height: 0; border-radius: 14px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 35%, var(--stage2), var(--stage));
  border: 1px solid var(--line);
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.nogl { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--ink2); }
.chip, .stnote, .cap { position: absolute; font: 500 10px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; pointer-events: none; }
.chip { left: 10px; top: 10px; background: var(--panel); border: 1px solid var(--line); padding: 6px 8px; border-radius: 8px; }
.cap { left: 50%; top: 10px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 6px 9px; border-radius: 8px; white-space: nowrap; opacity: 0; transition: opacity .25s; font-size: 11px; font-variant-numeric: tabular-nums; }
.cap.on { opacity: 1; }
.stnote { left: 12px; bottom: 14px; color: var(--ink2); max-width: calc(100% - 120px); line-height: 1.3; }
.stnote.pick { color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 8px; border-radius: 8px; left: 10px; bottom: 12px; }
.fabs { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 8px; }
.fab { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); padding: 0; }
.tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; background: var(--accent); color: var(--accent-ink); font: 500 10px/1 var(--f-mono); letter-spacing: .03em; padding: 3px 5px; border-radius: 5px; white-space: nowrap; will-change: transform; opacity: 0; transition: opacity .5s; }
.tag.on { opacity: .95; }

.side { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.guide { flex: 1; min-height: 0; position: relative; overflow-y: auto; scroll-snap-type: y proximity; overscroll-behavior: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.guide::-webkit-scrollbar { display: none; }
.step { min-height: 100%; scroll-snap-align: start; display: flex; flex-direction: column; gap: 8px; padding-block: 2px 8px; opacity: .45; transition: opacity .3s; }
.step.on { opacity: 1; }
.kicker { font: 500 11.5px/1.25 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--accent-text); }
.kicker .draft { margin-left: 6px; padding: 2px 5px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); }
.step h2 { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 6.6vw, 33px); line-height: 1.02; letter-spacing: .005em; text-wrap: balance; }
.step p { font-size: 15.5px; line-height: 1.42; max-width: 62ch; }
.needs { font: 500 11.5px/1.35 var(--f-mono); color: var(--ink2); }
.watch { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 0 11px; font-size: 14px; line-height: 1.38; color: var(--ink2); max-width: 62ch; }
.watch[open] { padding-bottom: 9px; }
.watch summary, .more summary { min-height: 40px; display: flex; align-items: center; cursor: pointer; font: 500 10.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
.more summary { color: var(--ink2); text-decoration: underline; text-transform: none; letter-spacing: 0; font: 400 14px/1 var(--f-body); min-height: 36px; }
.more p { font-size: 14.5px; color: var(--ink2); }
.step.answered > p, .step.answered > .needs, .step.answered > .more { display: none; }
.verdict b { display: block; font: 500 10.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); margin-bottom: 5px; }
.q { display: flex; flex-direction: column; gap: 7px; max-width: 62ch; }
.opt { min-height: 44px; text-align: left; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 15.5px; }
.verdict { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 12px; font-size: 14.5px; line-height: 1.4; }
.verdict.good { border-color: var(--good); }
.verdict.bad { border-color: var(--bad); }
.verdict p { font-size: 14.5px; }
.actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.actions .muted { color: var(--ink2); font-size: 14px; }
.actions .btn { min-height: 44px; }

.pager { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pager .btn { min-height: 46px; padding: 0 16px; }
.dots { display: flex; gap: 0; }
.dots button { width: 22px; height: 44px; padding: 0; border: 0; background: none; display: grid; place-items: center; }
.dots i { display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: transform .2s, background .2s; }
.dots button.on i { background: var(--accent-text); transform: scale(1.5); }
.app.textonly .stage { display: none; }
.app.textonly .side { max-width: 640px; width: 100%; margin-inline: auto; }

.stage.explore { position: fixed; inset: 0; z-index: 50; border-radius: 0; border: 0; flex: none; }
.stage.explore .chip, .stage.explore .stnote, .stage.explore .fabs, .stage.explore .tags, .stage.explore .cap { display: none; }
.xui { display: none; position: absolute; left: 0; right: 0; pointer-events: none; gap: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.stage.explore .xui { display: flex; }
.xtop { top: 0; padding-top: calc(12px + env(safe-area-inset-top, 0px)); justify-content: space-between; align-items: center; }
.xbottom { bottom: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.xui > * { pointer-events: auto; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); min-width: 0; }
.seg button { border: 0; background: none; min-height: 44px; padding: 0 14px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.pcard { width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.pcard strong { font-family: var(--f-display); font-size: 22px; font-weight: 700; line-height: 1.1; }
.pcard span { font-size: 14px; color: var(--ink2); }

.stage.garage { flex: none; height: clamp(230px, 40vh, 380px); }
.stage.garage .chip, .stage.garage .cap, .stage.garage .stnote, .stage.garage .fabs, .stage.garage .tags { display: none; }
.ghint { display: none; position: absolute; left: 10px; bottom: 10px; font: 500 10px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); background: var(--panel); border: 1px solid var(--line); padding: 6px 8px; border-radius: 8px; pointer-events: none; }
.stage.garage .ghint { display: block; }
.sw { display: flex; flex-wrap: wrap; gap: 8px; }
.sw button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.sw button.def { width: auto; padding: 0 14px; border-radius: 22px; background: var(--panel); font-size: 14px; font-weight: 600; }
.sw button[aria-pressed="true"] { outline: 3px solid var(--accent-text); outline-offset: 2px; }
.gcard { gap: 2px; }
.gcard b { font-size: 20px; }
.progress { height: 4px; border-radius: 2px; background: var(--line); flex: none; }
.progress i { display: block; height: 100%; border-radius: 2px; background: var(--accent); transition: width .25s; }
.qopts { display: flex; flex-direction: column; gap: 10px; }
.qopts .opt { min-height: 56px; font-size: 17px; }
.chips.nums .cb { min-height: 52px; min-width: 52px; font-size: 18px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--ink2); font-size: 14px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.h2q { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.05; text-wrap: balance; }

@media (max-height: 740px) {
  .step h2 { font-size: clamp(22px, 6vw, 28px); }
  .step p { font-size: 15px; }
  .watch { font-size: 13.5px; }
  .stage { flex-basis: clamp(130px, 27%, 280px); }
}
@media (min-width: 860px) {
  .app { flex-direction: row; gap: 20px; }
  .stage { flex: 1.15 1 0; }
  .side { flex: 1 1 0; max-width: 560px; }
  .step { justify-content: center; }
  .scroll, .cta, .wh, .brandrow { max-width: 720px; width: 100%; margin-inline: auto; }
}
@media (prefers-reduced-motion: reduce) { .step, .tag, .dots i, .cap { transition: none; } }
</style>
</head>
<body>
<section class="screen" data-screen="repair"></section>
<section class="screen" data-screen="shop" hidden></section>
<section class="screen" data-screen="shops" hidden></section>
<section class="screen" data-screen="ask" hidden></section>
<section class="screen" data-screen="pick" hidden></section>
<section class="screen" data-screen="garage" hidden></section>
<section class="screen" data-screen="bike" hidden></section>
<section class="screen" data-screen="q" hidden></section>
<section class="screen" data-screen="tools" hidden></section>
<section class="screen" data-screen="nohelp" hidden></section>

<section class="screen" data-screen="guide" hidden>
  <div class="gtop">
    <button class="ib" data-do="leaveGuide" aria-label="Close guide"><svg viewBox="0 0 24 24" width="22" height="22" style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="t" id="gtitle"></div>
    <button class="toggle" id="textonly" aria-pressed="false">Text only</button>
  </div>
  <main class="app" id="app">
    <section class="stage" id="stage" aria-label="3D view of the bike">
      <canvas id="gl"></canvas>
      <div class="nogl" id="nogl">The 3D view is not available on this device. The written steps still work.</div>
      <div class="tags" id="tags"></div>
      <div class="ghint">Drag to turn · pinch to zoom · tap a part</div>
      <div class="chip" id="chip" aria-live="polite">1 / 5</div>
      <div class="cap" id="cap"></div>
      <div class="stnote" id="note"></div>
      <div class="fabs">
        <button class="fab" id="replay" aria-label="Replay animation"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
        <button class="fab" id="expand" aria-label="Explore in 3D"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="xui xtop">
        <button class="fab" id="xclose" aria-label="Close 3D explorer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div class="seg" role="group" aria-label="Which parts to show">
          <button id="xfocus" aria-pressed="false">Step focus</button>
          <button id="xall" aria-pressed="true">Show all</button>
        </div>
      </div>
      <div class="xui xbottom">
        <div class="pcard" aria-live="polite"><strong id="pname">Tap a part</strong><span id="palias">Drag to rotate, pinch to zoom.</span><span id="pdesc"></span></div>
      </div>
    </section>
    <section class="side">
      <div class="guide" id="guide"></div>
      <div class="pager">
        <button class="btn" id="prev">Back</button>
        <div class="dots" id="dots"></div>
        <button class="btn primary" id="next">Next step</button>
      </div>
    </section>
  </main>
</section>

<nav class="tabbar" id="tabbar" aria-label="Main">

    <span class="s">Test ride it for a minute, then pick one.</span>
    <button class="btn primary wide" data-do="doneYes">Yes, all good</button>
    <button class="btn wide" data-do="doneNo">Not yet, help me</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2, HP = Math.PI / 2;
  const ease = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
  const ramp = (t, a, b) => ease((t - a) / (b - a));
  const nowS = () => performance.now() / 1000;
  const eur = (n) => '€' + n.toFixed(2);

  /* ============================================================
     APP DATA (example data for the demo)
     ============================================================ */
  const TYPES = { city: 'City bike', road: 'Road bike', mtb: 'Mountain bike' };
  const SHIFT = { mechanical: 'Mechanical derailleur', electronic: 'Electronic derailleur', hub: 'Hub gears', single: 'Single speed' };
  const BRANDS = { shimano: 'Shimano', sram: 'SRAM', campagnolo: 'Campagnolo', other: 'Other / not sure' };
  const SCREWS = { cross: 'Cross (Phillips)', hex: 'Hex (Allen)', unknown: 'Not sure' };

  const SAVED = [
    { id: 'racer', name: 'Red Racer', type: 'road', motor: false, shifting: null, brand: null, speeds: null, screws: null, colors: {} },
    { id: 'daily', name: 'Everyday', type: 'city', motor: false, shifting: 'mechanical', brand: 'shimano', speeds: 7, screws: 'cross', colors: {} },
    { id: 'trail', name: 'Trail Hardtail', type: 'mtb', susp: 'hard', motor: false, shifting: 'mechanical', brand: 'sram', speeds: 10, screws: 'hex', colors: {} },
    { id: 'ecom', name: 'Commuter E-bike', type: 'city', motor: true, shifting: 'hub', brand: null, speeds: null, screws: null, colors: {} },
    { id: 'enduro', name: 'Enduro', type: 'mtb', susp: 'full', motor: false, shifting: 'mechanical', brand: 'sram', speeds: 12, screws: 'hex', colors: {} }
  ];
  const TUTS = [
    { id: 'index', title: 'Gears skip or shift slowly', sub: 'Adjust the rear derailleur', ready: true },
    { id: 'flat', title: 'Fix a flat tire', sub: 'Patch or replace the inner tube' },
    { id: 'chain', title: 'Chain falls off or keeps dropping', sub: 'Find the cause, put it back' },
    { id: 'brakes', title: 'Brakes squeal or feel weak', sub: 'Pads, alignment, cables' },
    { id: 'noise', title: 'Creaking or clicking noises', sub: 'Find where it comes from' },
    { id: 'wheel', title: 'Remove and refit a wheel', sub: 'Quick release and thru axle' }
  ];

  function summary(b) {
    const p = [(b.type === 'mtb' && b.susp === 'full' ? 'Full-suspension MTB' : TYPES[b.type]) + (b.motor ? ' · electric' : '')];
    if (b.shifting) p.push(SHIFT[b.shifting] + (b.speeds ? ', ' + b.speeds + '-speed' : ''));
    if (b.brand && b.shifting === 'mechanical') p.push(BRANDS[b.brand]);
    return p.join(' · ');
  }
  function missing(b) {
    const m = [];
    if (!b.shifting) m.push('type of shifting');
    else if (b.shifting === 'mechanical') {
      if (!b.speeds) m.push('number of gears');
      if (!b.screws) m.push('screw heads');
    }
    return m;
  }

  const state = {
    screen: 'repair', tut: null, bike: null, orig: null, isNew: false, saveMode: 'new', saveChanges: true,
    have: {}, pickId: null, q: null, gb: null, gsel: '', nohelp: null, query: '', chat: [],
    shop: { bikes: ['daily'], items: ['chain', 'cables'] },
    work: { bike: 'racer', express: false, partner: false }
  };
  const hist = [];

  /* ============================================================
     GUIDE DATA: bike record -> 3D bike, steps built from the record
     ============================================================ */
  const PITCH = 0.0254;                       // chain pitch in scene units (1 unit = 0.5 m)
  const rOf = (teeth) => PITCH / (2 * Math.sin(Math.PI / teeth));
  const HUBY = 0.7, RX = -0.9, RT = 0.73;
  const LIFT = 0.3, GROUND = -0.03;
  const GAP_OK = 0.011, GAP_BIG = 0.036, GAP_SMALL = 0.004;   // pulley to cog gap (x500 = mm)

  function cassetteFor(type, n) {
    const last = type === 'road' ? 28 : type === 'city' ? (n <= 8 ? 28 : 34) : (n >= 11 ? 51 : n >= 9 ? 42 : 34);
    const out = [];
    for (let i = 0; i < n; i++) {
      let t = Math.round(11 * Math.pow(last / 11, i / (n - 1)));
      if (i && t <= out[i - 1]) t = out[i - 1] + 1;
      out.push(t);
    }
    return out;
  }
  function toBike(rec) {
    const road = rec.type === 'road', mtb = rec.type === 'mtb', full = mtb && rec.susp === 'full';
    rec.colors = rec.colors || {};
    const Bk = {
      type: road ? 'road' : mtb ? 'mountain' : 'city', name: rec.name || 'Your bike', motor: !!rec.motor,
      frame: full ? 'full' : road ? 'road' : 'regular', forkKind: mtb ? 'susp' : 'rigid', FX: full ? 1.47 : 1.0, colors: rec.colors,
      bar: road ? 'drop' : mtb ? 'riser' : 'flat',
      cassette: cassetteFor(rec.type, rec.speeds || 8), chainring: road ? 50 : mtb ? 32 : 44,
      tt: road ? 0.028 : mtb ? 0.07 : 0.045, barrelAt: road ? 'derailleur' : 'shifter',
      shifterName: road ? 'brake lever' : 'trigger shifter'
    };
    const r = Bk.frame === 'road';
    Bk.n = Bk.cassette.length;
    Bk.sp = 0.16 / (Bk.n - 1);
    Bk.zs = Bk.cassette.map((t, i) => 0.32 - i * Bk.sp);
    Bk.rs = Bk.cassette.map(rOf);
    Bk.rc = rOf(Bk.chainring);
    Bk.chainW = Math.min(0.02, Bk.sp * 0.7);
    Bk.ST = full ? [-0.3, 1.45] : r ? [-0.2, 1.5] : [-0.22, 1.5];
    Bk.HT = full ? [1.04, 1.58] : r ? [0.84, 1.42] : [0.78, 1.5];
    Bk.HB = full ? [1.198, 1.256] : r ? [0.9, 1.17] : [0.86, 1.15];
    Bk.saddleY = full ? 1.84 : r ? 1.8 : 1.76;
    const hx = Bk.HT[0], hy = Bk.HT[1];
    Bk.C = [hx + 0.14, hy + 0.03];
    Bk.S = Bk.bar === 'drop' ? [Bk.C[0] + 0.1, Bk.C[1] - 0.03, 0.21] : Bk.bar === 'riser' ? [hx - 0.04, hy + 0.125, 0.25] : [hx - 0.04, hy + 0.085, 0.27];
    Bk.barTop = Bk.bar === 'drop' ? [Bk.S[0] - 0.05, Bk.S[1] + 0.04] : Bk.bar === 'riser' ? [hx - 0.04, hy + 0.18] : [hx - 0.04, hy + 0.14];
    return Bk;
  }
  let B = toBike(SAVED[1]);
  let CTX = { stand: true, ruler: false, screws: 'cross', motor: false };

  function makeSteps(B, X) {
    const sm = B.zs[0], lg = B.zs[B.n - 1];
    const barrelDer = B.barrelAt === 'derailleur';
    const barrelWhere = barrelDer ? 'on the rear derailleur, where the cable enters it' : 'on the ' + B.shifterName + ', where the cable leaves it';
    const m = Math.floor(B.n / 2);
    const lim = X.screws === 'hex' ? 'Allen key (2.5 or 3 mm)' : X.screws === 'cross' ? 'Phillips screwdriver' : 'Phillips screwdriver or Allen key';
    const behind = () => ({ p: [RX - 1.7, 0.7, 0.24], t: [RX, 0.52, 0.24] });
    const gapCam = () => ({ p: [RX - 0.85, 0.62, 0.95], t: [RX, 0.52, 0.14] });
    const barrelCam = () => {
      if (barrelDer) return { p: [RX - 1.0, 0.95, 1.3], t: [RX, 0.6, 0.2] };
      const t = [B.S[0] - 0.07, B.S[1], B.S[2]];
      return { p: [t[0] - 0.55, t[1] + 0.55, t[2] + 0.85], t: t };
    };
    const mainCam = () => barrelDer ? barrelCam() : { p: [RX - 1.5, 1.0, 2.3], t: [RX, 0.55, 0.22] };
    const inCtx = ['derailleur', 'cassette', 'chain', 'rearWheel', 'frame'];
    const stand = X.stand;
    return [
      {
        kicker: 'Prep',
        title: stand ? 'Clamp the bike, shift to the smallest cog' : 'Flip the bike, shift to the smallest cog',
        text: (stand ? 'Clamp the seatpost in the repair stand so the rear wheel hangs free. '
          : 'Turn the bike upside down so it rests on the saddle and handlebars, with the rear wheel free to spin. ') +
          'Turn the pedals by hand and use the ' + B.shifterName + ' until the chain sits on the smallest cog (' + B.cassette[0] + ' teeth), the one furthest from the wheel.',
        watch: 'Shift while turning the pedals. Moving the shifter with the cranks still does nothing, which is easy to mistake for a broken cable.' +
          (stand ? '' : B.motor ? ' This is an e-bike: switch the assist off and ask someone to help you flip it.' : ' Do not leave hydraulic disc brakes upside down for long.'),
        tools: stand ? ['Repair stand'] : ['Towel for the saddle'],
        cam: () => ({ p: [-1.6, 1.3, 5.2], t: [0, 0.9, 0.1] }),
        hot: ['derailleur', 'shifter'], ctx: 'all',
        tags: [{ a: 'cogS', text: 'Cog' }, { a: 'pulley', text: 'Derailleur' }, { a: 'shifter', text: 'Shifter' }],
        cycle: 5, anim: (t) => ({ z: lg + (sm - lg) * ramp(t, 1, 2.4) })
      },
      {
        kicker: 'Derailleur / high limit', title: 'Check the high limit (H)',
        text: 'Chain on the smallest cog? Look from directly behind the bike. Where is the upper pulley compared with the cog?',
        watch: 'Turn directions in this guide are as you look at the screw from behind the bike. Use small steps and check the pulley after each one.',
        tools: [lim],
        cam: behind, hot: ['hScrew'], ctx: inCtx,
        tags: [{ a: 'cogS', text: 'Cog' }, { a: 'pulley', text: 'Pulley' }, { a: 'h', text: 'H' }],
        decision: {
          kind: 'align', autoFix: true, target: 'small', screw: 'h',
          fixedTitle: 'Aligned', fixedText: 'The pulley now sits straight under the cog. Continue to the next step.',
          opts: [
            { id: 'ok', label: 'Straight under the cog', off: 0, title: 'Nothing to change', text: 'The H limit is set. Continue to the next step.' },
            { id: 'in', label: 'Toward the spokes', off: -0.07, dir: 'ccw', title: 'The H screw is too tight',
              text: 'The derailleur cannot reach the smallest cog. Turn the H screw counterclockwise, a quarter turn at a time, until the pulley sits straight under the cog.' },
            { id: 'out', label: 'Away from the spokes', off: 0.07, dir: 'cw', title: 'The H screw is too loose',
              text: 'The pulley goes past the smallest cog and the chain can drop off. Turn the H screw clockwise, a quarter turn at a time, until the pulley sits straight under the cog.' }
          ]
        }
      },
      {
        kicker: 'Derailleur / low limit', title: 'Check the low limit (L)',
        text: 'Shift to the largest cog (' + B.cassette[B.n - 1] + ' teeth) and look from behind again. Where is the upper pulley compared with it?',
        watch: 'If the L screw is too loose the chain can fall into the spokes. After adjusting, check this limit by hand before you ride.',
        tools: [lim],
        cam: behind, hot: ['lScrew'], ctx: inCtx,
        tags: [{ a: 'cogL', text: 'Cog' }, { a: 'pulley', text: 'Pulley' }, { a: 'l', text: 'L' }],
        decision: {
          kind: 'align', autoFix: true, target: 'large', screw: 'l',
          fixedTitle: 'Aligned', fixedText: 'The pulley now sits straight under the cog. Continue to the next step.',
          opts: [
            { id: 'ok', label: 'Straight under the cog', off: 0, title: 'Nothing to change', text: 'The L limit is set. Continue to the next step.' },
            { id: 'in', label: 'Toward the spokes', off: -0.07, dir: 'cw', title: 'The L screw is too loose',
              text: 'The pulley goes past the largest cog and the chain can fall into the spokes. Turn the L screw clockwise, a quarter turn at a time, until the pulley sits straight under the cog.' },
            { id: 'out', label: 'Away from the spokes', off: 0.07, dir: 'ccw', title: 'The L screw is too tight',
              text: 'The derailleur cannot reach the largest cog. Turn the L screw counterclockwise, a quarter turn at a time, until the pulley sits straight under the cog.' }
          ]
        }
      },
      {
        kicker: 'B screw gap', draft: true, title: 'Set the gap to the cassette',
        text: 'Keep the chain on the largest cog. Looking from the side, how big is the gap between the upper pulley and the cog?',
        more: 'About 5 to 6 mm is a common target, but your derailleur manual has the exact value. ' + (X.ruler ? 'Measure the gap with your ruler.' : 'No ruler? A 5 mm Allen key held across the gap works as a gauge.') + ' If the bike has several chainrings at the front, use the smallest one.',
        watch: 'Changing this gap affects shifting, so the next step checks the shifting again. Too small and the pulley rubs the big cog, too big and shifting to it gets sluggish.',
        tools: ['Allen key'].concat(X.ruler ? ['Small ruler'] : []),
        cam: gapCam, hot: ['bScrew'], ctx: inCtx,
        tags: [{ a: 'cogL', text: 'Largest cog' }, { a: 'pulley', text: 'Pulley' }, { a: 'b', text: 'B screw' }],
        decision: {
          kind: 'gap', screw: 'b',
          fixedTitle: 'Gap is right', fixedText: 'The gap is about 5 to 6 mm. Shift through the gears next to make sure nothing rubs.',
          opts: [
            { id: 'ok', label: 'About 5 to 6 mm', gap: GAP_OK, title: 'Nothing to change', text: 'The gap is right. Continue to the next step.' },
            { id: 'big', label: 'Wider than that', gap: GAP_BIG, dir: 'ccw', title: 'The pulley sits too far from the cog',
              text: 'A big gap makes shifting to the largest cog sluggish. Turn the B screw counterclockwise, a little at a time, until the gap is about 5 to 6 mm.' },
            { id: 'small', label: 'Narrower, nearly touching', gap: GAP_SMALL, dir: 'cw', title: 'The pulley sits too close to the cog',
              text: 'The pulley can rub the largest cog. Turn the B screw clockwise, a little at a time, until the gap is about 5 to 6 mm.' }
          ]
        }
      },
      {
        kicker: 'Cable tension', title: 'Fix slow or noisy shifting',
        text: 'Shift one gear at a time and watch the chain. Which direction is slow or noisy?',
        more: 'The barrel adjuster is the knurled ring ' + barrelWhere + '. Turn it in quarter turns and shift again after each one.',
        watch: 'This applies to standard mechanical derailleurs. Rapid-rise derailleurs work the other way round. Finish with a short test ride.',
        tools: ['Your fingers'],
        cam: mainCam, hot: ['barrel'], ctx: 'all',
        tags: [{ a: 'barrel', text: 'Barrel' }, { a: 'pulley', text: 'Derailleur' }],
        decision: {
          kind: 'shift', screw: 'barrel', m: m, cams: { main: mainCam, barrel: barrelCam },
          fixedTitle: 'Shifts well now', fixedText: 'The chain follows the shifter again. Shift through all ' + B.n + ' gears once more, then take a short test ride.',
          opts: [
            { id: 'up', label: 'Slow to a bigger cog', cap: 'Slow to bigger cog', goal: m + 1, dir: 'ccw', title: 'Not enough cable tension',
              text: 'The derailleur lags when moving to a bigger cog, toward the spokes. Turn the barrel adjuster ' + barrelWhere + ' counterclockwise (unscrew it), a quarter turn at a time, and shift again.' },
            { id: 'down', label: 'Slow to a smaller cog', cap: 'Slow to smaller cog', goal: m - 1, dir: 'cw', title: 'Too much cable tension',
              text: 'The derailleur lags when moving to a smaller cog, away from the spokes. Turn the barrel adjuster ' + barrelWhere + ' clockwise (screw it in), a quarter turn at a time, and shift again.' },
            { id: 'ok', label: 'Smooth both ways', cap: 'Smooth shifting', goal: m + 1, title: 'Nothing to change', text: 'Your shifting is indexed. Finish with a short test ride.' }
          ]
        }
      }
    ];
  }
  let STEPS = makeSteps(B, CTX);

  const META = {
    frame: ['Frame', 'Main frame and rear triangle', 'Everything bolts to this.'],
    fork: ['Fork', 'Holds the front wheel', 'Steers the bike and, on mountain bikes, soaks up bumps.'],
    shock: ['Rear shock', 'Damper and spring', 'Controls how the rear wheel moves over bumps.'],
    rearWheel: ['Rear wheel', 'Rim, tyre and spokes', 'Carries the cassette on its hub.'],
    frontWheel: ['Front wheel', 'Rim, tyre and spokes', 'Steers the bike.'],
    cassette: ['Cassette', 'Also called the cogs or sprockets', 'The stack of rear gears the chain moves across.'],
    chainring: ['Chainring and crank', 'Front gear', 'Where your pedalling force enters the chain.'],
    chain: ['Chain', 'Drivetrain', 'Wraps the chainring, cog and both pulleys.'],
    derailleur: ['Rear derailleur', 'Also called the rear mech or Schaltwerk', 'Pushes the chain from cog to cog.'],
    hScrew: ['High limit screw (H)', 'Marked H on the derailleur', 'Stops the derailleur at the smallest cog.'],
    lScrew: ['Low limit screw (L)', 'Marked L on the derailleur', 'Stops the derailleur before the spokes.'],
    bScrew: ['B screw', 'Also called the B-tension or B-gap screw', 'Sets the distance between the upper pulley and the cogs.'],
    shifter: ['Shifter', 'Also called the shift lever', 'Pulls or releases the cable.'],
    barrel: ['Barrel adjuster', 'Also called the cable adjuster', 'Fine-tunes cable tension in quarter turns.'],
    handlebar: ['Handlebar and stem', 'Cockpit', 'Holds the shifter and brake levers.'],
    cable: ['Shift cable', 'Inner wire in its housing', 'Carries the pull from shifter to derailleur.']
  };

  /* ============================================================
     GUIDE PANEL (text side)
     ============================================================ */
  const guide = $('#guide'), dotsEl = $('#dots');
  let stepEls = [], dotEls = [], cur = -1, exploring = false, gl = null;
  const hooks = { onStep: () => {}, arrow: () => {}, rebuild: () => {}, exit: null, replay: () => {}, garageOpen: () => {}, garageClose: () => {}, garageSelect: () => {}, garageName: () => {}, picked: null };

  function stepHTML(S, i) {
    let h = '<div class="kicker">Step ' + (i + 1) + ' of ' + STEPS.length + ' &middot; ' + S.kicker + (S.draft ? '<span class="draft">Draft</span>' : '') + '</div><h2>' + S.title + '</h2>';
    h += '<div class="needs">Needs: ' + S.tools.join(', ') + '</div><p>' + S.text + '</p>';
    if (S.more) h += '<details class="more"><summary>More detail</summary><p>' + S.more + '</p></details>';
    if (S.decision) h += '<div class="q"></div>';
    if (S.watch) h += '<details class="watch"' + (S.decision ? '' : ' open') + '><summary>Watch for</summary>' + S.watch + '</details>';
    return '<article class="step" data-i="' + i + '">' + h + '</article>';
  }
  function renderGuide() {
    guide.innerHTML = STEPS.map(stepHTML).join('');
    stepEls = $$('.step', guide);
    STEPS.forEach((S, i) => { if (S.decision) $('.q', stepEls[i]).innerHTML = decHTML(S, blankDec()); });
    dotsEl.innerHTML = STEPS.map((s, i) => '<button aria-label="Go to step ' + (i + 1) + '"><i></i></button>').join('');
    dotEls = $$('button', dotsEl);
    dotEls.forEach((d, i) => d.addEventListener('click', () => goTo(i)));
  }
  function goTo(i, instant) {

    const evalA = (a) => {

  /* ============================================================
     3D
     ============================================================ */
  const canvas = $('#gl'), stage = $('#stage');

  } catch (err) {

  }

  if (gl) {
    const T = THREE;
    gl.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(35, 1, 0.05, 60);
    scene.add(new T.AmbientLight(0xffffff, 0.45));
    scene.add(new T.HemisphereLight(0xffffff, 0x5a6b78, 0.7));
    const sun = new T.DirectionalLight(0xffffff, 0.85);
    sun.position.set(-2, 4, 5);
    scene.add(sun);
    const holder = new T.Group();      // tilts the flipped bike onto saddle and bars
    const root = new T.Group();        // lifts (stand) or flips the bike
    const bike = new T.Group();        // rebuilt from the record
    scene.add(holder); holder.add(root); root.add(bike);
    const grid = new T.GridHelper(9, 36, 0x888888, 0x888888);
    grid.material.transparent = true; grid.material.opacity = 0.22; grid.position.y = GROUND;
    scene.add(grid);
    const standG = new T.Group();
    scene.add(standG);

    const COL = { part: new T.Color(), accent: new T.Color(), good: new T.Color(), bad: new T.Color() };
    const tmpCol = new T.Color();
    const standMat = new T.MeshStandardMaterial({ color: 0x888888, roughness: 0.6, metalness: 0.2 });
    function readColors() {
      const cs = getComputedStyle(document.documentElement);

      COL.good.set(g('--good', '#1E9E5A')); COL.bad.set(g('--bad', '#D6453D'));

    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
    new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    let viewMode = 'guide', selIds = [];

    /* ---- part helpers ---- */
    let parts = {};
    function part(id) {
      const g = new T.Group();

      parts[id] = { id: id, group: g, mats: [], vis: 1, visT: 1, hot: 0, hotT: 0 };

    }
    function newMat(opt) {

      mesh.userData.partId = id;

    }

    function tubeGeo(a, b, r) {
      const A = new T.Vector3(a[0], a[1], a[2]), Bv = new T.Vector3(b[0], b[1], b[2]);
      const len = A.distanceTo(Bv);

      g.applyMatrix4(new T.Matrix4().makeRotationFromQuaternion(new T.Quaternion().setFromUnitVectors(UP, Bv.clone().sub(A).normalize())));

    }
    function curveGeo(pts, r) {
      return new T.TubeGeometry(new T.CatmullRomCurve3(pts.map((p) => new T.Vector3(p[0], p[1], p[2]))), 48, r, 8, false);
    }
    const tA = new T.Vector3(), tB = new T.Vector3(), tD = new T.Vector3();
    function seg(mesh, a, b) {

      const L = tD.length();

    function disposeChildren(g) {
      while (g.children.length) {

        g.remove(c);
        c.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material !== standMat) o.material.dispose(); });
      }
    }

    /* ---- colors chosen in the garage, and the name on the down tube ---- */
    const custom = { frame: null, rims: null }, customHex = {};
    function syncCustom() {
      ['frame', 'rims'].forEach((k) => {
        const hx = (B.colors && B.colors[k]) || '';
        if (customHex[k] !== hx) { customHex[k] = hx; custom[k] = hx ? new T.Color(hx) : null; }
      });
    }
    let decal = null;
    function makeDecal(a, b, r) {
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy), th = Math.atan2(dy, dx);
      const w = len * 0.5, h = 0.07, cv = document.createElement('canvas');
      cv.width = 1280; cv.height = Math.round(1280 * h / w);
      const tex = new T.CanvasTexture(cv);
      const mat = new T.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
      const geo = new T.PlaneGeometry(w, h), ca = Math.cos(th), sa = Math.sin(th);
      [1, -1].forEach((sd) => {
        const m = new T.Mesh(geo, mat);
        m.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(new T.Vector3(sd * ca, sd * sa, 0), new T.Vector3(-sa, ca, 0), new T.Vector3(0, 0, sd)));
        m.position.set(a[0] + dx * 0.66, a[1] + dy * 0.66, sd * (r + 0.003));
        m.userData.partId = 'frame';
        parts.frame.group.add(m);
      });
      decal = { cv: cv, tex: tex, mat: mat, key: '' };
    }
    function drawDecal() {
      if (!decal) return;
      const fc = custom.frame || COL.part, txt = (B.name || 'Your bike').toUpperCase();
      const key = txt + '|' + fc.getHexString();
      if (key === decal.key) return;
      decal.key = key;
      const c = decal.cv.getContext('2d'), W = decal.cv.width, H = decal.cv.height;
      c.clearRect(0, 0, W, H);
      c.fillStyle = (0.2126 * fc.r + 0.7152 * fc.g + 0.0722 * fc.b) > 0.45 ? '#14202A' : '#F4F7F9';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      let size = Math.round(H * 0.8);
      const font = (z) => '700 ' + z + 'px "Barlow Condensed","Arial Narrow",sans-serif';
      c.font = font(size);
      while (c.measureText(txt).width > W * 0.94 && size > 20) { size -= 4; c.font = font(size); }
      c.fillText(txt, W / 2, H / 2 + size * 0.04);
      decal.tex.needsUpdate = true;
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (decal) decal.key = ''; });

    /* ---- build a whole bike from the record ---- */
    let anchors = {}, cage = null, armA = null, armB = null, chainMesh = null, circ = null, N = 0;
    const PATH = { x: [], y: [], z: [], l: [], n: 0 };
    const RP = 0.04, LC = 0.13;
    let GAPN = GAP_OK, gapCur = GAP_OK;
    const Q = new T.Object3D();

    function rAtZ(z) {
      const zs = B.zs, rs = B.rs, n = B.n;
      if (z >= zs[0]) return rs[0];
      if (z <= zs[n - 1]) return rs[n - 1];
      for (let i = 0; i < n - 1; i++) {
        if (z <= zs[i] && z >= zs[i + 1]) return rs[i] + (rs[i + 1] - rs[i]) * ((zs[i] - z) / (zs[i] - zs[i + 1]));
      }
      return rs[0];
    }
    function layout(z) {
      const r = rAtZ(z);
      const u = (r - B.rs[0]) / (B.rs[B.n - 1] - B.rs[0] || 1);
      const a = -0.55 + 0.5 * u;                       // cage swings back on small cogs
      const gx = RX - 0.005, gy = HUBY - r - GAPN - RP;
      return { r: r, a: a, gx: gx, gy: gy, lx: gx + LC * Math.sin(a), ly: gy - LC * Math.cos(a) };
    }

    function buildBike() {
      disposeChildren(bike);
      if (decal) { decal.tex.dispose(); decal.mat.dispose(); decal = null; }
      parts = {}; anchors = {};
      const road = B.frame === 'road', ST = B.ST, HT = B.HT, HB = B.HB, C = B.C, S = B.S;

      function wheel(id, cx) {
        part(id);
        const rm = RT - B.tt, rim = RT - 2 * B.tt - 0.012;
        add(id, new T.TorusGeometry(rm, B.tt, 12, 56), [cx, HUBY, 0], null, { k: 0.45 });
        add(id, new T.TorusGeometry(rim, 0.02, 8, 56), [cx, HUBY, 0], null, { k: 1, tint: 'rims' });
        add(id, new T.CylinderGeometry(0.032, 0.032, 0.5, 16), [cx, HUBY, 0.12], [HP, 0, 0]);
        for (let i = 0; i < 18; i++) {
          const a = (i / 18) * TAU;
          add(id, tubeGeo([cx, HUBY, i % 2 ? 0.03 : -0.03], [cx + (rim - 0.01) * Math.cos(a), HUBY + (rim - 0.01) * Math.sin(a), 0], 0.004), null, null, { k: 1.2 });
        }
      }
      const full = B.frame === 'full', FX = B.FX, hx = HT[0], hy = HT[1];
      wheel('rearWheel', RX);
      wheel('frontWheel', FX);

      part('frame');
      const TINT = { tint: 'frame' };
      const ft = (a, b, r) => add('frame', tubeGeo(a, b, r), null, null, TINT);
      const TT0 = [ST[0] + 0.03, ST[1] - 0.12], TT1 = [hx, hy - 0.02];
      const Uu = [0.14, 1.0], Dd = [0.5, 0.35 + 0.5 / HB[0] * (HB[1] - 0.35) + 0.05];
      let dtR = 0.03;
      if (!full) {
        const fr = B.type === 'mountain' ? 0.03 : road ? 0.02 : 0.024;
        dtR = fr + 0.004;
        const sy = ST[1] - (road ? 0.05 : 0);
        [
          [[0, 0.35, 0], [ST[0], ST[1], 0], fr + (road ? 0.004 : 0)],
          [[ST[0], ST[1], 0], [HT[0], HT[1], 0], fr - 0.002],
          [[HT[0], HT[1], 0], [HB[0], HB[1], 0], 0.03],
          [[0, 0.35, 0], [HB[0], HB[1], 0], fr + 0.004],
          [[0, 0.35, 0.1], [RX, HUBY, 0.1], 0.016], [[ST[0], sy, 0.05], [RX, HUBY, 0.1], 0.012],
          [[0, 0.35, -0.1], [RX, HUBY, -0.1], 0.016], [[ST[0], sy, -0.05], [RX, HUBY, -0.1], 0.012],
          [[ST[0], ST[1], 0], [ST[0] - 0.04, B.saddleY - 0.04, 0], 0.015]
        ].forEach((f) => ft(f[0], f[1], f[2]));
      } else {
        // generic demo layout: stays pass outside the tire, a rocker link drives a coil shock in the front triangle
        const PV = [-0.06, 0.43], SS = [-0.42, 1.3], RK = [-0.2, 1.1];
        dtR = 0.038;
        ft([0, 0.35, 0], [ST[0], ST[1], 0], 0.03);
        ft([TT0[0], TT0[1], 0], [TT1[0], TT1[1], 0], 0.028);
        ft([hx, hy, 0], [HB[0], HB[1], 0], 0.035);
        ft([0, 0.35, 0], [HB[0], HB[1], 0], 0.038);
        ft([ST[0], ST[1], 0], [ST[0] - 0.04, B.saddleY - 0.04, 0], 0.015);

          ft([PV[0], PV[1], sd * 0.1], [RX, HUBY, sd * 0.1], 0.017);

          ft([SS[0], SS[1], sd * 0.1], [RK[0], RK[1], sd * 0.04], 0.013);

      part('fork');
      {
        const dl = Math.hypot(hx - HB[0], hy - HB[1]);

        const pts = [], turns = 9, R = 0.05, n = turns * 14;

      part('handlebar'); part('shifter');
      if (B.bar === 'flat') {
        const b1 = [hx - 0.04, hy + 0.12];

          add('handlebar', curveGeo([[C[0], C[1], z], [C[0] + 0.1, C[1] + 0.01, z], [C[0] + 0.18, C[1] - 0.08, z], [C[0] + 0.16, C[1] - 0.19, z], [C[0] + 0.05, C[1] - 0.23, z]], 0.013));
        });

        add('shifter', tubeGeo([S[0] + 0.03, S[1] - 0.03, S[2]], [S[0] + 0.09, S[1] - 0.14, S[2]], 0.008), null, null, { k: 0.5 });
      }

      part('barrel');
      if (B.barrelAt === 'shifter') {

      } else {
        parts.barrel.group.position.set(RX - 0.03, 0.725, 0.1);
        add('barrel', new T.CylinderGeometry(0.016, 0.016, 0.04, 8));
        add('barrel', new T.BoxGeometry(0.008, 0.008, 0.006), [0.015, 0.012, 0], null, { dark: true });

      part('cable');
      const end = B.barrelAt === 'shifter' ? [RX - 0.03, 0.705, 0.1] : [RX - 0.03, 0.75, 0.1];
      const dt = (u) => [HB[0] * (1 - u), 0.35 + (HB[1] - 0.35) * u, 0.06];
      const ty = (x) => TT0[1] + (x - TT0[0]) / (TT1[0] - TT0[0]) * (TT1[1] - TT0[1]);
      const path = B.bar === 'drop'
        ? [[S[0] - 0.02, S[1] - 0.03, S[2]], [C[0] - 0.02, C[1] - 0.1, 0.17], [HB[0] - 0.03, HB[1] + 0.0, 0.08], [HB[0] * 0.7, dt(0.7)[1], 0.06], dt(0.35), [0.05, 0.42, 0.06], [-0.4, 0.52, 0.12], [RX + 0.12, 0.62, 0.12], end]
        : full
          ? [[S[0] - 0.1, S[1], S[2]], [hx - 0.16, ty(hx - 0.16) + 0.05, 0.07], [0.6, ty(0.6) + 0.05, 0.07], [0.2, ty(0.2) + 0.05, 0.07], [-0.12, ty(-0.12) + 0.05, 0.07], [-0.34, 1.1, 0.13], [RX + 0.1, 0.9, 0.13], [RX + 0.03, 0.82, 0.12], end]
          : [[S[0] - 0.1, S[1], S[2]], [0.5, 1.56, 0.12], [0.3, 1.54, 0.05], [-0.1, 1.54, 0.05], [-0.22, 1.54, 0.06], [-0.56, 1.12, 0.1], [RX + 0.03, 0.82, 0.12], end];
      add('cable', curveGeo(path, 0.006), null, null, { k: 0.6 });

      part('chainring');
      add('chainring', new T.CylinderGeometry(B.rc, B.rc, 0.02, Math.min(B.chainring, 60)), [0, 0.35, 0.22], [HP, 0, 0], { flat: true });
      add('chainring', tubeGeo([0, 0.35, 0.27], [0.12, 0.1, 0.29], 0.02));

      part('cassette');
      B.cassette.forEach((t, i) => add('cassette', new T.CylinderGeometry(B.rs[i], B.rs[i], B.sp * 0.5, Math.min(t, 48)), [RX, HUBY, B.zs[i]], [HP, 0, 0], { k: 0.9, flat: true }));

      part('derailleur');
      add('derailleur', new T.BoxGeometry(0.05, 0.12, 0.06), [RX - 0.03, 0.64, 0.1]);
      armA = add('derailleur', new T.BoxGeometry(0.016, 1, 0.016), null, null, { k: 0.85 });
      armB = add('derailleur', new T.BoxGeometry(0.016, 1, 0.016), null, null, { k: 0.85 });
      cage = new T.Group();
      parts.derailleur.group.add(cage);
      const pw = B.chainW / 2 + 0.006;
      add('derailleur', new T.CylinderGeometry(RP, RP, 0.012, 16), [0, 0, 0], [HP, 0, 0], { parent: cage, k: 0.7 });
      add('derailleur', new T.CylinderGeometry(RP, RP, 0.012, 16), [0, -LC, 0], [HP, 0, 0], { parent: cage, k: 0.7 });
      add('derailleur', tubeGeo([0, 0, pw], [0, -LC, pw], 0.008), null, null, { parent: cage });
      add('derailleur', tubeGeo([0, 0, -pw], [0, -LC, -pw], 0.008), null, null, { parent: cage });

      function screw(id, px, py) {
        const p = part(id);
        p.group.position.set(px, py, 0.1);
        add(id, new T.CylinderGeometry(0.015, 0.015, 0.03, 14), [-0.01, 0, 0], [0, 0, HP]);
        add(id, new T.BoxGeometry(0.004, 0.006, 0.026), [-0.026, 0, 0], null, { dark: true });
      }
      screw('hScrew', RX - 0.06, 0.67);
      screw('lScrew', RX - 0.06, 0.61);
      screw('bScrew', RX + 0.058, 0.655);

      circ = [
        { x: 0, y: 0.35, z: 0.22, r: B.rc, s: 1 },
        { x: RX, y: HUBY, z: B.zs[0], r: B.rs[0], s: 1 },
        { x: RX, y: 0.5, z: B.zs[0], r: RP, s: -1 },
        { x: RX, y: 0.4, z: B.zs[0], r: RP, s: 1 }
      ];
      part('chain');
      GAPN = gapCur = GAP_OK;
      setCirc(B.zs[B.n - 1]);
      const Lref = buildPath(circ, PATH);
      N = Math.max(40, Math.round(Lref / PITCH / 2) * 2);
      const cm = newMat({ k: 0.6 });
      chainMesh = new T.InstancedMesh(new T.BoxGeometry(PITCH * 0.8, 0.014, B.chainW), cm, N);
      chainMesh.frustumCulled = false;
      chainMesh.userData.partId = 'chain';
      chainMesh.instanceMatrix.setUsage(T.DynamicDrawUsage);
      parts.chain.group.add(chainMesh);
      parts.chain.mats.push(cm);

      function anchor(parent, x, y, z) { const o = new T.Object3D(); o.position.set(x, y, z); parent.add(o); return o; }
      anchors = {
        cogS: anchor(bike, RX, HUBY + B.rs[0] + 0.015, B.zs[0]),
        cogL: anchor(bike, RX, HUBY + B.rs[B.n - 1] + 0.015, B.zs[B.n - 1]),
        pulley: cage, shifter: anchor(bike, S[0], S[1] + 0.05, S[2]),
        h: parts.hScrew.group, l: parts.lScrew.group, b: parts.bScrew.group, barrel: parts.barrel.group
      };
      derZ = B.zs[B.n - 1];
      updateDer(derZ);
      buildStand();
      applySetup();
    }

    function buildStand() {
      disposeChildren(standG);
      const cx = B.ST[0] - 0.03, cz = -0.34, cy = 1.62 + LIFT, top = cy + 0.2;
      const mk = (geo, p) => { const m = new T.Mesh(geo, standMat); if (p) m.position.set(p[0], p[1], p[2]); standG.add(m); return m; };
      mk(tubeGeo([cx, GROUND, cz], [cx, top, cz], 0.02));
      mk(tubeGeo([cx, cy, cz], [cx, cy, -0.02], 0.016));
      mk(new T.BoxGeometry(0.07, 0.1, 0.07), [cx, cy, 0]);
      [HP, HP + TAU / 3, HP + 2 * TAU / 3].forEach((a) => {
        mk(tubeGeo([cx, GROUND + 0.02, cz], [cx + 0.5 * Math.cos(a), GROUND + 0.02, cz + 0.5 * Math.sin(a)], 0.018));
      });
    }
    function applySetup() {
      const grounded = viewMode === 'garage';
      standG.visible = CTX.stand && !grounded;
      if (grounded) {
        holder.position.set(0, 0, 0); holder.rotation.set(0, 0, 0);
        root.rotation.set(0, 0, 0); root.position.set(0, 0, 0);
      } else if (CTX.stand) {
        holder.position.set(0, 0, 0); holder.rotation.set(0, 0, 0);
        root.rotation.set(0, 0, 0); root.position.set(0, LIFT, 0);
      } else {
        const xs = -0.3, ys = B.saddleY + 0.025, by = B.barTop;
        const th = -Math.atan((ys - by[1]) / (by[0] - xs));
        holder.position.set(xs, GROUND, 0); holder.rotation.set(0, 0, th);
        root.rotation.set(Math.PI, 0, 0); root.position.set(-xs, ys, 0);
      }
      scene.updateMatrixWorld(true);
    }

    function setCirc(z) {
      const L = layout(z);
      circ[1].r = L.r; circ[1].z = z;
      circ[2].x = L.gx; circ[2].y = L.gy; circ[2].z = z;
      circ[3].x = L.lx; circ[3].y = L.ly; circ[3].z = z;
      return L;
    }
    function updateDer(z) {
      const L = setCirc(z);
      cage.position.set(L.gx, L.gy, z);
      cage.rotation.z = L.a;
      seg(armA, [RX - 0.03, 0.585, 0.1], [L.gx, L.gy + 0.022, z]);
      seg(armB, [RX - 0.03, 0.625, 0.1], [L.gx, L.gy + 0.052, z]);
      const total = buildPath(circ, PATH);
      let j = 0;
      const sp = total / N;
      for (let k = 0; k < N; k++) {
        const s = k * sp;
        while (j < PATH.n - 2 && PATH.l[j + 1] < s) j++;
        const sl = (PATH.l[j + 1] - PATH.l[j]) || 1e-6, u = (s - PATH.l[j]) / sl;
        Q.position.set(PATH.x[j] + (PATH.x[j + 1] - PATH.x[j]) * u, PATH.y[j] + (PATH.y[j + 1] - PATH.y[j]) * u, PATH.z[j] + (PATH.z[j + 1] - PATH.z[j]) * u);
        tD.set(PATH.x[j + 1] - PATH.x[j], PATH.y[j + 1] - PATH.y[j], PATH.z[j + 1] - PATH.z[j]).normalize();
        Q.quaternion.setFromUnitVectors(AX, tD);
        Q.scale.set(1, k % 2 ? 0.7 : 1, 1);
        Q.updateMatrix();
        chainMesh.setMatrixAt(k, Q.matrix);
      }
      chainMesh.instanceMatrix.needsUpdate = true;
    }

    /* ---- ghost target, gap marker and turn arrow (bike space) ---- */
    const ghostMat = new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75, depthTest: false });
    const ghost = new T.Group();
    const ghostRing = new T.Mesh(new T.TorusGeometry(RP + 0.012, 0.005, 8, 36), ghostMat);
    const plumb = new T.Mesh(new T.BoxGeometry(0.004, 1, 0.004), ghostMat);
    const gapBar = new T.Mesh(new T.BoxGeometry(0.012, 1, 0.012), ghostMat);
    ghostRing.renderOrder = plumb.renderOrder = gapBar.renderOrder = 9;
    ghost.add(ghostRing, plumb, gapBar);
    ghost.visible = false;
    root.add(ghost);

    const arrowMat = new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthTest: false });
    const arrow = new T.Group();
    root.add(arrow);
    arrow.visible = false;
    function buildArrow(r) {
      while (arrow.children.length) arrow.remove(arrow.children[0]);
      const arc = new T.Mesh(new T.TorusGeometry(r, r * 0.16, 8, 32, Math.PI * 1.5), arrowMat);
      const cone = new T.Mesh(new T.ConeGeometry(r * 0.4, r * 0.8, 12), arrowMat);
      cone.position.set(0, -r, 0); cone.rotation.z = -HP;
      arc.renderOrder = cone.renderOrder = 10;
      arrow.add(arc, cone);
    }
    const wp = new T.Vector3();
    function placeArrow(kind, dir) {
      if (!kind) { arrow.visible = false; return; }
      scene.updateMatrixWorld(true);
      const g = kind === 'h' ? parts.hScrew.group : kind === 'l' ? parts.lScrew.group : kind === 'b' ? parts.bScrew.group : parts.barrel.group;
      g.getWorldPosition(wp);
      root.worldToLocal(wp);
      buildArrow(kind === 'barrel' ? 0.045 : 0.033);
      if (kind === 'barrel' && B.barrelAt === 'derailleur') {
        arrow.position.set(wp.x, wp.y + 0.045, wp.z);
        arrow.rotation.set(dir === 'cw' ? HP : -HP, 0, 0);
      } else if (kind === 'b') {
        arrow.position.set(wp.x + 0.045, wp.y, wp.z);
        arrow.rotation.set(0, dir === 'ccw' ? HP : -HP, 0);
      } else {
        arrow.position.set(wp.x - 0.045, wp.y, wp.z);
        arrow.rotation.set(0, dir === 'ccw' ? -HP : HP, 0);
      }
      arrow.visible = true;
    }
    hooks.arrow = (kind, dir) => placeArrow(kind, dir);

    /* ---- camera (poses are written in bike space and converted to world) ---- */
    const look = new T.Vector3(0, 0.9, 0.1);
    camera.position.set(-1.6, 1.3, 5.2);
    const cv = new T.Vector3();
    const toWorld = (a) => { cv.set(a[0], a[1], a[2]); root.localToWorld(cv); return cv.clone(); };
    let tw = null;
    function goCam(pose, instant) {
      scene.updateMatrixWorld(true);
      const p1 = toWorld(pose.p), t1 = toWorld(pose.t);
      if (instant || reduce) { camera.position.copy(p1); look.copy(t1); tw = null; return; }
      tw = { p0: camera.position.clone(), t0: look.clone(), p1: p1, t1: t1, k: 0, dur: 1.5 };
    }
    const controls = new T.OrbitControls(camera, canvas);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.minDistance = 0.35; controls.maxDistance = 9; controls.enabled = false;

    /* ---- focus ---- */
    let showAll = true, selected = null;
    const GSTEP = { hot: [], ctx: 'all', tags: [], cycle: 10, cam: () => ({ p: [-1.5, 1.45, 5.6], t: [0.28, 0.85, 0] }), anim: () => ({ z: B.zs[Math.floor(B.n / 2)] }) };
    function applyFocus() {
      if (viewMode === 'garage') {
        Object.keys(parts).forEach((id) => { parts[id].visT = 1; parts[id].hotT = selIds.indexOf(id) >= 0 ? 1 : 0; });
        return;
      }
      const S = STEPS[Math.max(cur, 0)];
      Object.keys(parts).forEach((id) => {
        const p = parts[id];
        const isHot = S.hot.indexOf(id) >= 0;
        const isCtx = S.ctx === 'all' || S.ctx.indexOf(id) >= 0 || ((id === 'fork' || id === 'shock') && S.ctx.indexOf('frame') >= 0);
        p.visT = (exploring && showAll) ? 1 : (isHot || isCtx ? 1 : 0.1);
        p.hotT = isHot ? 1 : 0;
        if (exploring && selected) { p.hotT = id === selected ? 1 : 0; p.visT = (showAll || id === selected || isHot || isCtx) ? 1 : 0.1; }
      });
    }

    /* ---- labels: small, shown for a few seconds, tap the stage to bring them back ---- */
    const tagsEl = $('#tags');
    let tagList = [], tagTimer = 0, noteTimer = 0;
    function revealTags() {
      tagList.forEach((t) => t.el.classList.add('on'));
      clearTimeout(tagTimer);
      tagTimer = setTimeout(() => tagList.forEach((t) => t.el.classList.remove('on')), 4500);
    }
    function buildTags(S) {
      tagsEl.innerHTML = '';
      tagList = (S.tags || []).map((t) => {
        const d = document.createElement('div');
        d.className = 'tag'; d.textContent = t.text;
        tagsEl.appendChild(d);
        return { el: d, obj: anchors[t.a] };
      }).filter((t) => t.obj);
      clearTimeout(tagTimer);
      tagTimer = setTimeout(revealTags, 700);
    }

    let t0 = nowS(), derZ = 0.16, camPhase = 'main';
    hooks.onStep = (S, first) => {
      camPhase = 'main';
      if (!exploring) goCam(S.cam(), first);
      applyFocus();
      placeArrow(S.arrow ? S.arrow.kind : null, S.arrow ? S.arrow.dir : null);
      buildTags(S);
      t0 = nowS();
    };
    hooks.rebuild = () => { buildBike(); applyFocus(); };
    hooks.garageOpen = (rec) => {
      viewMode = 'garage'; selIds = [];
      B = toBike(rec);
      buildBike(); applyFocus();
      const g = GSTEP.cam();
      camera.position.set(g.p[0], g.p[1], g.p[2]); look.set(g.t[0], g.t[1], g.t[2]);
      controls.target.copy(look); controls.maxPolarAngle = HP * 1.02; controls.maxDistance = 8;
      controls.enabled = true; controls.update(); tw = null;
      resize();
    };
    hooks.garageClose = () => {
      if (viewMode !== 'garage') return;
      viewMode = 'guide'; selIds = []; controls.enabled = false; controls.maxPolarAngle = Math.PI; controls.maxDistance = 9;
    };
    hooks.garageSelect = (ids) => { selIds = ids; applyFocus(); };
    hooks.garageName = (n) => { B.name = n || 'Your bike'; };
    $('#replay').addEventListener('click', () => { t0 = nowS(); resetDec(); renderDecision(); revealTags(); });

    /* ---- explore mode ---- */
    function showInfo(id) {
      const m = id ? META[id] : null;
      $('#pname').textContent = m ? m[0] : 'Tap a part';
      $('#palias').textContent = m ? m[1] : 'Drag to rotate, pinch to zoom.';
      $('#pdesc').textContent = m ? m[2] : '';
    }
    function enterExplore() {
      exploring = true; selected = null; tw = null;
      stage.classList.add('explore');
      controls.target.copy(look); controls.enabled = true;
      showInfo(null); applyFocus(); resize();
    }
    function exitExplore() {
      exploring = false; selected = null;
      stage.classList.remove('explore');
      controls.enabled = false;
      applyFocus(); resize();
      if (STEPS[cur]) goCam(STEPS[cur].cam(), false);
    }
    hooks.exit = exitExplore;
    $('#expand').addEventListener('click', enterExplore);
    $('#xclose').addEventListener('click', exitExplore);
    function setMode(all) {
      showAll = all;
      $('#xall').setAttribute('aria-pressed', all);
      $('#xfocus').setAttribute('aria-pressed', !all);
      applyFocus();
    }
    $('#xall').addEventListener('click', () => setMode(true));
    $('#xfocus').addEventListener('click', () => setMode(false));

    const ray = new T.Raycaster(), ndc = new T.Vector2();
    let down = null;
    canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
    canvas.addEventListener('pointerup', (e) => {
      if (!down) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
      down = null;
      if (moved > 8) return;
      const r = canvas.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObjects(bike.children, true).find((h) => h.object.userData.partId && parts[h.object.userData.partId] && parts[h.object.userData.partId].vis > 0.3);
      const id = hit ? hit.object.userData.partId : null;
      if (viewMode === 'garage') {
        selIds = id ? [id] : []; applyFocus();
        if (hooks.picked) hooks.picked(id);
      } else if (exploring) {
        selected = id; showInfo(id); applyFocus();
      } else {
        revealTags();
        if (id) {
          const n = $('#note');
          n.classList.add('pick');
          n.textContent = META[id][0];
          clearTimeout(noteTimer);
          noteTimer = setTimeout(updateNote, 3000);
        }
      }
    });

    /* ---- sizing ---- */
    const BASE_TAN = Math.tan((17.5 * Math.PI) / 180);
    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      if (!w || !h) return;
      gl.setSize(w, h, false);
      camera.aspect = w / h;
      camera.fov = (2 * Math.atan(BASE_TAN * Math.max(1, 1.3 / camera.aspect)) * 180) / Math.PI;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage);
    resize();

    /* ---- animation per frame ---- */
    function alignAnim(S, now) {
      const D = S.decision;
      const base = D.target === 'small' ? B.zs[0] : B.zs[B.n - 1];
      const out = { z: base, cap: '', status: null };
      if (!DEC.choice) {
        const t = (((now - t0) % 6) + 6) % 6, o = D.opts[Math.floor(t / 2)];
        out.z = base + o.off; out.cap = o.label;
        return out;
      }
      const o = D.opts.find((x) => x.id === DEC.choice);
      out.cap = o.label;
      if (DEC.fix) {
        const t = now - DEC.fixT0, p = ramp(t, 0.9, 2.6);
        out.z = base + o.off * (1 - p);
        const turn = 2 * ramp(t, 0.2, 2.6) * (o.dir === 'cw' ? 1 : -1);
        if (D.screw === 'h') out.h = turn; else out.l = turn;
        if (t > 3.0) finishFix();
      } else out.z = base + o.off;
      out.status = Math.abs(derZ - base) < 0.012 ? 'good' : 'bad';
      return out;
    }
    function gapAnim(S, now) {
      const D = S.decision, base = B.zs[B.n - 1];
      const out = { z: base, cap: '', status: null, gap: GAP_OK, live: true };
      if (!DEC.choice) {
        const t = (((now - t0) % 6) + 6) % 6, o = D.opts[Math.floor(t / 2)];
        out.gap = o.gap; out.cap = o.label; out.live = false;
        return out;
      }
      const o = D.opts.find((x) => x.id === DEC.choice);
      out.gap = o.gap;
      if (DEC.fix) {
        const t = now - DEC.fixT0, p = ramp(t, 0.9, 2.6);
        out.gap = o.gap + (GAP_OK - o.gap) * p;
        out.bs = 2 * ramp(t, 0.2, 2.6) * (o.dir === 'cw' ? 1 : -1);
        if (t > 3.0) finishFix();
      }
      out.status = Math.abs(gapCur - GAP_OK) < 0.0025 ? 'good' : 'bad';
      return out;
    }
    function shiftAnim(S, now) {
      const D = S.decision, base = B.zs[D.m];
      const out = { z: base, cap: '', status: null, phase: 'main' };
      const loop = (o, t) => {
        const stall = o.id === 'ok' ? 1 : 0.3;
        return base + (B.zs[o.goal] - base) * stall * (ramp(t, 0.5, 1.1) - ramp(t, 2.2, 2.8));
      };
      if (!DEC.choice) {
        const t = (((now - t0) % 9) + 9) % 9, k = Math.floor(t / 3), o = D.opts[k];
        out.z = loop(o, t - k * 3); out.cap = o.cap;
        return out;
      }
      const o = D.opts.find((x) => x.id === DEC.choice);
      out.cap = o.cap;
      if (DEC.fix) {
        const far = B.barrelAt === 'shifter';
        const T2 = far ? { a: 1.7, b: 3.1, s0: 5.0, s1: 5.8, back: 3.4, end: 6.6 } : { a: 0.3, b: 1.7, s0: 2.1, s1: 2.9, back: 0, end: 3.7 };
        const t = now - DEC.fixT0;
        out.phase = (far && t < T2.back) ? 'barrel' : 'main';
        out.b = 2 * ramp(t, T2.a, T2.b) * (o.dir === 'ccw' ? 1 : -1);
        out.z = base + (B.zs[o.goal] - base) * ramp(t, T2.s0, T2.s1);
        out.status = t < T2.s1 ? 'bad' : 'good';
        if (t > T2.end) finishFix();
      } else {
        out.z = loop(o, (((now - t0) % 3) + 3) % 3);
        out.status = o.id === 'ok' ? 'good' : 'bad';
      }
      return out;
    }
    const capEl = $('#cap');
    let lastCap = null;
    const pv = new T.Vector3();
    let last = nowS();
    function tick() {
      requestAnimationFrame(tick);
      const now = nowS();
      const dt = Math.min(0.05, now - last);
      last = now;
      if (!stage.offsetParent && !exploring) return;
      const S = viewMode === 'garage' ? GSTEP : STEPS[Math.max(cur, 0)];
      if (!S || !chainMesh) return;
      syncCustom(); drawDecal();
      if (decal) decal.mat.opacity = parts.frame ? parts.frame.vis : 1;

      const kind = S.decision ? S.decision.kind : null;
      const a = kind === 'shift' ? shiftAnim(S, now) : kind === 'gap' ? gapAnim(S, now) : kind === 'align' ? alignAnim(S, now) : S.anim((((now - t0) % S.cycle) + S.cycle) % S.cycle);
      derZ += (a.z - derZ) * (1 - Math.exp(-dt * 7));
      gapCur += ((a.gap == null ? GAP_OK : a.gap) - gapCur) * (1 - Math.exp(-dt * 7));
      GAPN = gapCur;
      updateDer(derZ);
      parts.hScrew.group.rotation.x = Math.PI * (a.h || 0);
      parts.lScrew.group.rotation.x = Math.PI * (a.l || 0);
      parts.bScrew.group.rotation.x = Math.PI * (a.bs || 0);
      const bv = Math.PI * (a.b || 0);
      if (B.barrelAt === 'shifter') parts.barrel.group.rotation.x = -bv; else parts.barrel.group.rotation.y = bv;

      if (S.decision && S.decision.cams) {
        const ph = a.phase || 'main';
        if (ph !== camPhase) { camPhase = ph; if (!exploring) goCam(S.decision.cams[ph](), false); }
      }

      ghost.visible = false;
      if (S.decision && !exploring) {
        if (kind === 'align') {
          const base = S.decision.target === 'small' ? B.zs[0] : B.zs[B.n - 1];
          const GN = GAPN; GAPN = GAP_OK;
          const L = layout(base);
          GAPN = GN;
          ghost.visible = true; ghostRing.visible = true; plumb.visible = true; gapBar.visible = false;
          ghostRing.position.set(L.gx, L.gy, base);
          const len = HUBY - L.gy;
          plumb.scale.set(1, len, 1);
          plumb.position.set(RX, HUBY - len / 2, base);
          ghostMat.color.copy(COL.accent);
        } else if (kind === 'gap') {
          const zc = B.zs[B.n - 1], top = HUBY - B.rs[B.n - 1];
          ghost.visible = true; ghostRing.visible = false; plumb.visible = false; gapBar.visible = true;
          gapBar.scale.set(1, Math.max(0.002, gapCur), 1);
          gapBar.position.set(RX + 0.05, top - gapCur / 2, zc);
          ghostMat.color.copy(COL.accent);
        }
      }
      let capText = '';
      if (S.decision && !exploring) capText = a.live ? ('Gap ' + (gapCur * 500).toFixed(1) + ' mm') : (a.cap || '');
      if (capText !== lastCap) { capEl.textContent = capText; capEl.classList.toggle('on', !!capText); lastCap = capText; }

      if (tw) {
        tw.k += dt / tw.dur;
        const e = ease(tw.k);
        camera.position.lerpVectors(tw.p0, tw.p1, e);
        camera.position.y += Math.sin(Math.PI * e) * 0.35;
        look.lerpVectors(tw.t0, tw.t1, e);
        if (tw.k >= 1) tw = null;
      }
      if (exploring || viewMode === 'garage') { controls.update(); look.copy(controls.target); }
      else camera.lookAt(look);

      const f = 1 - Math.exp(-dt * 6);
      Object.keys(parts).forEach((id) => {
        const p = parts[id];
        let hotT = p.hotT, hotCol = COL.accent;
        if (id === 'derailleur' && a.status) { hotT = 1; hotCol = a.status === 'good' ? COL.good : COL.bad; }
        p.vis += (p.visT - p.vis) * f;
        p.hot += (hotT - p.hot) * f;
        p.group.visible = p.vis > 0.01;
        p.mats.forEach((m) => {
          m.opacity = p.vis;
          m.depthWrite = p.vis > 0.98;
          if (m.userData.dark) { m.color.copy(COL.part).multiplyScalar(0.22); return; }
          tmpCol.copy((m.userData.tint && custom[m.userData.tint]) || COL.part).multiplyScalar(m.userData.k);
          m.color.copy(tmpCol).lerp(hotCol, p.hot);
          m.emissive.copy(hotCol).multiplyScalar(p.hot * 0.18);
        });
      });

      if (arrow.visible) {
        arrowMat.color.copy(COL.accent);
        arrowMat.opacity = 0.7 + 0.3 * Math.sin(now * 4);
      }

      if (!exploring && viewMode !== 'garage') {
        const w = stage.clientWidth, h = stage.clientHeight;
        scene.updateMatrixWorld(true);
        tagList.forEach((t) => {
          t.obj.getWorldPosition(pv);
          pv.project(camera);
          const x = (pv.x * 0.5 + 0.5) * w, y = (-pv.y * 0.5 + 0.5) * h;
          const off = pv.z > 1 || x < 12 || x > w - 12 || y < 24 || y > h - 12;
          t.el.style.visibility = off ? 'hidden' : 'visible';
          if (!off) t.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) translate(-50%,-150%)';
        });
      }
      gl.render(scene, camera);
    }
    buildBike();
    requestAnimationFrame(tick);
  }

  go('repair', true);
})();
</script>
</body>
</html>
